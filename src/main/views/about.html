<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>엔트리</title>
	<link rel='stylesheet' href='../../renderer/resources/styles/fonts.css'/>
	<link rel='stylesheet' href='../../renderer/resources/styles/about.css'/>
</head>

<body>
<div class="container">
	<div class="container_inner">
		<div class="logo_wrapper">
			<img src="../../renderer/resources/images/about/logo.png" class="logo"/>
		</div>
		<div>
			<div class="txtVersion">
				Version
				<span id="version"></span>
				<br>
				<a href="#" id="playEntryBtn">
					https://playentry.org
				</a>
				<br>
				<a href="#" id="openLicenseBtn" style="font-size: 11px; color: #999; text-decoration: underline; margin-top: 5px; display: inline-block;">
					Open Source License
				</a>
			</div>
			<div>
				<div class="btnVersionUpdate">
				</div>
				<div class="txtAlreadyVersion">
				</div>
			</div>
		</div>
	</div>
</div>

<script>
    window.$ = window.jQuery = require('jquery');
    const { shell } = require('electron');
	const remote = require('@electron/remote');

	(function () {
		const { app } = remote;
		const aboutWindow = remote.getCurrentWindow();
		const currentVersion = remote.getGlobal('sharedObject').version;
		const getLatestVersion = () => localStorage.getItem('lastCheckVersion') || '0.0.0';

		const $versionUpdateButton = $('.btnVersionUpdate');
		const $recentVersionText = $('.txtAlreadyVersion');

		$(window).keyup((event) => {
			//esc
			if (event.which === 27) {
				aboutWindow.hide();
			}
		});

		$('body').on('click', function () {
			aboutWindow.hide();
		});

		$('#playEntryBtn').on('click', function (e) {
			e.preventDefault();
			e.stopPropagation();
			shell.openExternal('https://playentry.org');
		});

		$('#openLicenseBtn').on('click', function (e) {
			e.preventDefault();
			e.stopPropagation();
			const path = require('path');
			const fs = require('fs');
			
			// Try to find LICENSE.txt in resources/ (packaged) or root (dev)
			let licensePath = path.join(app.getAppPath(), '..', 'LICENSE.txt');
			if (!fs.existsSync(licensePath)) {
				licensePath = path.join(app.getAppPath(), 'LICENSE.txt');
			}
			
			if (fs.existsSync(licensePath)) {
				shell.openPath(licensePath).catch(err => console.error(err));
			} else {
				alert("본 소프트웨어는 RHVoice 및 Uzbek-bin 데이터를 포함하고 있습니다.\nThis software includes RHVoice and Uzbek-bin data.\n\nComponents: RHVoice TTS Engine, Uzbek Language Data\nLicense: GNU Lesser General Public License v2.1 (LGPL v2.1)\nSource Code: https://github.com/RHVoice/RHVoice");
			}
		});

		$versionUpdateButton.on('click', () => {
			shell.openExternal(
					'https://github.com/JeongJun-Lee/entry-offline/releases',
			);
		});

		$('#version').text(currentVersion);

		aboutWindow.on('show', () => {
			const rawPersist = localStorage.getItem('persist:storage');
			const currentLangType = rawPersist ? JSON.parse(JSON.parse(rawPersist).persist)['lang'] : 'ko';

			window.Lang = require(`../../renderer/resources/lang/${currentLangType}.json`);
			$versionUpdateButton.text(Lang.General.recent_download2);
			$recentVersionText.text(Lang.General.latest_version);

			if (currentVersion < getLatestVersion()) {
				$recentVersionText.hide();
				$versionUpdateButton.show();
			} else {
				$versionUpdateButton.hide();
				$recentVersionText.show();
			}
		});
	}());
</script>
</body>

</html>

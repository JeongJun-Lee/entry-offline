<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>군집: 숫자 (k-평균) 모델 학습하기</title>
    <style>
        @font-face {
            font-family: 'NanumGothic';
            src: url('../../renderer/resources/fonts/NanumGothic.ttf') format('truetype');
        }

        :root {
            --primary-color: #4f80ff;
            --secondary-color: #f1f3f5;
            --text-main: #333;
            --text-sub: #666;
            --bg-body: #f7faff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --accent-blue: #ebf2ff;
        }

        body {
            font-family: 'NanumGothic', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styles */
        nav {
            background-color: #fff;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            height: 60px;
            box-sizing: border-box;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn svg {
            width: 24px;
            height: 24px;
            fill: #adb5bd;
        }

        .nav-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .apply-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .apply-btn:hover {
            background-color: #3b66d6;
        }

        /* Main Content */
        main {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .tutorial-link {
            color: var(--text-main);
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }

        .model-name-wrapper {
            background: white;
            padding: 12px 20px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            width: 380px;
        }

        .model-name-input {
            border: none;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            outline: none;
            color: #333;
        }

        .model-name-input::placeholder {
            color: #adb5bd;
        }

        /* Grid Layout */
        .columns {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 32px;
            flex: 1;
            min-height: 0;
        }

        .column-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .column-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .column-desc {
            font-size: 14px;
            color: var(--text-sub);
            word-break: keep-all;
        }

        /* Column 1 - Data Input Specific */
        .input-card {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .table-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            color: #333;
            outline: none;
            cursor: pointer;
            background-color: white;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .section-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }

        .drop-zone {
            background-color: #f1f8fc;
            border-radius: 8px;
            padding: 16px;
            min-height: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
        }

        .attr-pill {
            background-color: white;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
        }

        .attr-pill.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: var(--accent-blue);
        }

        /* Training Column */
        .train-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .train-top {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .algo-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .algo-name {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }

        .train-btn {
            background-color: #f8f9fa;
            color: #adb5bd;
            border: 1px solid #dee2e6;
            width: 100%;
            padding: 12px 0;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: not-allowed;
            margin-bottom: 10px;
        }

        .train-btn.ready {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            cursor: pointer;
        }

        .train-status {
            font-size: 12px;
            color: var(--primary-color);
            text-align: center;
        }

        .train-bottom {
            padding: 20px;
            background-color: #fdfdfd;
        }

        .condition-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            margin-bottom: 20px;
        }

        .condition-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            gap: 8px;
        }

        .condition-label {
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .condition-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .counter-btn {
            width: 32px;
            height: 32px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #333;
            font-size: 16px;
        }

        .counter-btn:hover {
            background: #f1f3f5;
        }

        .condition-input {
            width: 50px;
            height: 32px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-align: center;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
        }

        .condition-input:focus {
            border-color: var(--primary-color);
        }

        .toggle-group {
            display: flex;
            width: 100%;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            overflow: hidden;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 0;
            background: white;
            border: none;
            border-right: 1px solid #dee2e6;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            text-align: center;
            transition: all 0.2s;
        }

        .toggle-btn:last-child {
            border-right: none;
        }

        .toggle-btn.active {
            color: var(--primary-color);
            background: var(--accent-blue);
            font-weight: bold;
        }

        /* Result Column */
        .result-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 480px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 24px;
        }

        .result-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-size: 14px;
            text-align: center;
        }

        .preview-area {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .test-input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .test-input-row input {
            width: 80px;
            padding: 6px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-align: right;
        }

        .test-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
        }

        .test-btn:hover {
            background-color: #e9ecef;
        }

        .cluster-result {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            text-align: center;
        }

        .cluster-name {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e0;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-left">
            <button class="close-btn" onclick="window.close()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
            <div class="nav-title" id="nav-title">군집: 숫자 (k-평균) 모델 학습하기</div>
        </div>
        <button class="apply-btn" id="apply-btn">적용하기</button>
    </nav>

    <main>
        <div class="top-info">
            <span class="tutorial-link" id="view-tutorial">튜토리얼 보기</span>
        </div>

        <div class="model-name-wrapper">
            <input type="text" class="model-name-input" id="model-name" placeholder="새로운 모델">
        </div>

        <div class="columns">
            <!-- Column 1: 데이터 입력 -->
            <div class="column">
                <div class="column-header">
                    <div>
                        <div class="column-title" id="input-title">데이터 입력</div>
                        <div class="column-desc" id="input-desc">모델이 학습할 데이터를 입력합니다.</div>
                    </div>
                </div>

                <div class="input-card">
                    <select class="table-select" id="table-select" onchange="onTableSelect()">
                        <option value="" disabled selected id="select-table-placeholder">테이블을 선택해 주세요.</option>
                        <option value="test_table_1">아이리스 붓꽃 데이터세트</option>
                        <option value="test_table_2">날씨 데이터세트</option>
                    </select>

                    <div id="attribute-config" style="display: none; flex-direction: column; gap: 16px;">
                        <div>
                            <div class="section-title">핵심 속성</div>
                            <div class="section-desc">여기에 속성을 선택할 수 있습니다.</div>
                            <div class="drop-zone" id="core-attrs">
                                <!-- Attributes go here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 2: 학습 -->
            <div class="column">
                <div class="column-header" style="flex-direction:column;">
                    <div class="column-title" id="train-title">학습</div>
                    <div class="column-desc" id="train-desc">입력한 데이터로 모델을 학습합니다.</div>
                </div>

                <div class="train-card">
                    <div class="train-top">
                        <div class="algo-title" id="algo-title">알고리즘</div>
                        <div class="algo-name" id="algo-name">k-평균</div>
                        <button class="train-btn" id="train-btn" disabled>학습하기</button>
                        <div class="train-status" id="train-status">데이터를 먼저 입력해 주세요.</div>
                    </div>
                    <div class="train-bottom">
                        <div class="condition-title" id="condition-title">학습 조건</div>

                        <div class="condition-row">
                            <div class="condition-label">군집 개수</div>
                            <div class="condition-controls">
                                <button class="counter-btn" onclick="updateKValue(-1)">-</button>
                                <input type="number" class="condition-input" id="k-value" value="4" min="2" max="10">
                                <button class="counter-btn" onclick="updateKValue(1)">+</button>
                            </div>
                        </div>

                        <div class="condition-row">
                            <div class="condition-label">중심점 기준</div>
                            <div class="toggle-group">
                                <button class="toggle-btn active" onclick="setCentroid('furthest', this)"
                                    id="btn-centroid-furthest">가장 먼 거리</button>
                                <button class="toggle-btn" onclick="setCentroid('random', this)"
                                    id="btn-centroid-random">무작위</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 3: 결과 -->
            <div class="column">
                <div class="column-header" style="flex-direction:column;">
                    <div class="column-title" id="result-title">결과</div>
                    <div class="column-desc" id="result-desc">학습한 모델의 결과를 확인합니다.</div>
                </div>

                <div class="result-container">
                    <div class="result-placeholder" id="predict-placeholder">
                        모델을 먼저 학습해 주세요.
                    </div>
                    <div class="preview-area" id="preview-area">
                        <div id="test-inputs-container">
                            <!-- Dynamically add inputs based on core attributes -->
                        </div>
                        <div class="test-btn" id="test-btn">확인하기</div>

                        <div class="cluster-result" id="cluster-result" style="display:none;">
                            <div style="font-size:14px; color:#666; margin-bottom:8px;">군집 결과:</div>
                            <div class="cluster-name" id="cluster-name">군집 1</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const i18n = {
            en: {
                navTitle: "Clustering: Numeric (k-Means) Model Training",
                apply: "Apply",
                modelNamePlaceholder: "New Model",
                trainBtn: "Train",
                trainStatusEmpty: "Please input data first.",
                trainStatusReady: "Ready to train.",
                trainStatusTraining: "Training...",
                trainStatusDone: "Training complete.",
                resultPlaceholder: "Please train the model first.",
                centroidFurthest: "Furthest",
                centroidRandom: "Random",
                testBtnText: "Check"
            },
            ko: {
                navTitle: "군집: 숫자 (k-평균) 모델 학습하기",
                apply: "적용하기",
                modelNamePlaceholder: "새로운 모델",
                trainBtn: "학습하기",
                trainStatusEmpty: "데이터를 먼저 입력해 주세요.",
                trainStatusReady: "학습 준비 완료",
                trainStatusTraining: "학습 중...",
                trainStatusDone: "학습 완료",
                resultPlaceholder: "모델을 먼저 학습해 주세요.",
                centroidFurthest: "가장 먼 거리",
                centroidRandom: "무작위",
                testBtnText: "확인하기"
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'ko';
        const t = i18n[lang] || i18n.ko;

        async function setupUI() {
            document.getElementById('nav-title').innerText = t.navTitle;
            document.getElementById('apply-btn').innerText = t.apply;
            document.getElementById('model-name').placeholder = t.modelNamePlaceholder;
            document.getElementById('train-btn').innerText = t.trainBtn;
            document.getElementById('train-status').innerText = t.trainStatusEmpty;
            document.getElementById('predict-placeholder').innerText = t.resultPlaceholder;
            document.getElementById('btn-centroid-furthest').innerText = t.centroidFurthest;
            document.getElementById('btn-centroid-random').innerText = t.centroidRandom;
            document.getElementById('test-btn').innerText = t.testBtnText;

            tables = await loadTables();
            renderTableSelect();
        }

        window.addEventListener('load', setupUI);

        let tables = [];

        async function loadTables() {
            let foundTables = [];
            try {
                if (window.ipcInvoke) {
                    const res = await window.ipcInvoke('getEntryTables');
                    if (res && Array.isArray(res) && res.length > 0) {
                        foundTables = res.map(t => ({
                            id: t.id || Math.random().toString(36).substr(2, 9),
                            name: t.name || t.id,
                            fields: t.fields || (t.table ? t.table[0] : []),
                            data: t.data || (t.table ? t.table.slice(1) : [])
                        }));
                    }
                }
            } catch (e) {
                console.error("Error fetching tables via IPC:", e);
            }

            if (foundTables.length === 0) {
                foundTables = [
                    { id: 'test_table_1', name: '아이리스 붓꽃 데이터세트', fields: ['꽃받침 길이', '꽃받침 너비', '꽃잎 길이', '꽃잎 너비', '품종'], data: [] },
                    { id: 'test_table_2', name: '날씨 데이터세트', fields: ['온도', '습도', '풍속', '미세먼지'], data: [] }
                ];
            }
            return foundTables;
        }

        window.refreshTables = async function () { tables = await loadTables(); renderTableSelect(); };

        let selectedTableIndex = -1;
        let selectedCoreAttrs = [];
        let isTraining = false;
        let centroidType = 'furthest';

        function updateKValue(delta) {
            const input = document.getElementById('k-value');
            let val = parseInt(input.value) + delta;
            if (val < parseInt(input.min)) val = parseInt(input.min);
            if (val > parseInt(input.max)) val = parseInt(input.max);
            input.value = val;
        }

        function setCentroid(type, btn) {
            centroidType = type;
            document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function renderTableSelect() {
            const tableSelect = document.getElementById('table-select');
            if (!tableSelect) return;

            const currentSelectedTable = tables[selectedTableIndex];

            tableSelect.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = "";
            placeholder.disabled = true;
            placeholder.innerText = tables.length === 0 ? getMsg('noData') : getMsg('selectTable');
            tableSelect.appendChild(placeholder);

            let isCurrentAvailable = false;
            tables.forEach((t, index) => {
                const opt = document.createElement('option');
                opt.value = index; // Use index as value
                opt.innerText = t.name;
                if (currentSelectedTable && index === selectedTableIndex) {
                    opt.selected = true;
                    isCurrentAvailable = true;
                }
                tableSelect.appendChild(opt);
            });

            if (tables.length === 1 && !isCurrentAvailable) {
                tableSelect.value = 0; // Select the first table if only one and none selected
                onTableSelect();
            } else if (!isCurrentAvailable) {
                placeholder.selected = true;
                document.getElementById('attribute-config').style.display = 'none';
            } else {
                tableSelect.value = selectedTableIndex;
            }
        }

        function onTableSelect() {
            const tableSelect = document.getElementById('table-select');
            const selectedIndex = parseInt(tableSelect.value); // Get the index

            if (isNaN(selectedIndex) || selectedIndex < 0 || selectedIndex >= tables.length) {
                selectedTableIndex = -1;
                document.getElementById('attribute-config').style.display = 'none';
                updateTrainStatus();
                return;
            }

            const tableConfig = tables[selectedIndex]; // Get table config by index
            selectedTableIndex = selectedIndex; // Update selectedTableIndex with the actual index

            document.getElementById('attribute-config').style.display = 'flex';

            const coreContainer = document.getElementById('core-attrs');
            coreContainer.innerHTML = '';
            selectedCoreAttrs = [];

            tableConfig.fields.forEach((field, index) => {
                const pill = document.createElement('div');
                pill.className = 'attr-pill active';
                pill.innerText = field;
                pill.dataset.index = index;
                pill.onclick = () => toggleAttr(pill);
                coreContainer.appendChild(pill);
                selectedCoreAttrs.push(index);
            });

            updateTrainStatus();
        }

        function toggleAttr(pill) {
            const index = parseInt(pill.dataset.index);
            if (pill.classList.contains('active')) {
                pill.classList.remove('active');
                selectedCoreAttrs = selectedCoreAttrs.filter(i => i !== index);
            } else {
                pill.classList.add('active');
                selectedCoreAttrs.push(index);
            }
            updateTrainStatus();
        }

        function updateTrainStatus() {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');

            if (selectedTableIndex !== -1 && selectedCoreAttrs.length > 0) {
                btn.classList.add('ready');
                btn.disabled = false;
                status.innerText = t.trainStatusReady;
            } else {
                btn.classList.remove('ready');
                btn.disabled = true;
                status.innerText = t.trainStatusEmpty;
            }
        }

        document.getElementById('train-btn').onclick = async () => {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');

            btn.classList.remove('ready');
            btn.disabled = true;
            status.innerText = t.trainStatusTraining;

            await new Promise(r => setTimeout(r, 1000));

            isTraining = true;
            status.innerText = t.trainStatusDone;
            btn.classList.add('ready');
            btn.disabled = false;

            showResult();
        };

        function showResult() {
            document.getElementById('predict-placeholder').style.display = 'none';
            document.getElementById('preview-area').style.display = 'flex';
            document.getElementById('cluster-result').style.display = 'none';

            const tableConfig = tables[selectedTableIndex];
            const testContainer = document.getElementById('test-inputs-container');
            testContainer.innerHTML = '';

            selectedCoreAttrs.forEach(index => {
                const fieldName = tableConfig.fields[index];
                const row = document.createElement('div');
                row.className = 'test-input-row';
                row.innerHTML = `
                    <div class="condition-label">${tableConfig.fields[index]}</div>
                    <input type="text" class="condition-input test-input" data-idx="${index}" value="0">
                `;
                testContainer.appendChild(row);
            });
        }

        document.getElementById('test-btn').onclick = () => {
            if (!isTraining) return;
            document.getElementById('cluster-result').style.display = 'block';

            const k = parseInt(document.getElementById('k-value').value) || 4;
            const randomCluster = Math.floor(Math.random() * k) + 1;

            document.getElementById('cluster-name').innerText = `군집 ${randomCluster}`;
        };

        document.getElementById('apply-btn').onclick = () => {
            const projectName = document.getElementById('model-name').value || t.modelNamePlaceholder;
            const kValue = parseInt(document.getElementById('k-value').value) || 4;

            const modelData = {
                type: 'cluster',
                name: projectName,
                hyperparameters: {},
                trainParam: {
                    k: kValue,
                    initialCentroids: "kmpp",
                    neighbors: 10
                },
                tableData: {
                    id: tables[selectedTableIndex].id,
                    name: tables[selectedTableIndex].name,
                    fields: tables[selectedTableIndex].fields,
                    data: tables[selectedTableIndex].data,
                    select: [selectedCoreAttrs, []]
                }
            };
            modelData.tableId = tables[selectedTableIndex].id;
            modelData.coreAttrs = selectedCoreAttrs;

            if (window.ipcSend) { window.ipcSend('trainComplete', modelData); window.close(); } else if (window.opener) {
                window.opener.postMessage({
                    type: 'trainComplete',
                    modelData: modelData
                }, '*');
                window.close();
            }
        };
    </script>
</body>

</html>

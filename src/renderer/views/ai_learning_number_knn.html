<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분류: 숫자 (kNN) 모델 학습하기</title>
    <style>
        @font-face {
            font-family: 'NanumGothic';
            src: url('../../renderer/resources/fonts/NanumGothic.ttf') format('truetype');
        }

        :root {
            --primary-color: #4f80ff;
            --secondary-color: #f1f3f5;
            --text-main: #333;
            --text-sub: #666;
            --bg-body: #f7faff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --accent-blue: #ebf2ff;
        }

        body {
            font-family: 'NanumGothic', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styles */
        nav {
            background-color: #fff;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            height: 60px;
            box-sizing: border-box;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn svg {
            width: 24px;
            height: 24px;
            fill: #adb5bd;
        }

        .nav-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .apply-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .apply-btn:hover {
            background-color: #3b66d6;
        }

        .apply-btn:disabled {
            background-color: #f8f9fa;
            color: #adb5bd;
            border: 1px solid #dee2e6;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Main Content */
        main {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .tutorial-link {
            color: var(--text-main);
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }

        .model-name-wrapper {
            background: white;
            padding: 12px 20px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            width: 380px;
        }

        .model-name-input {
            border: none;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            outline: none;
            color: #333;
        }

        .model-name-input::placeholder {
            color: #adb5bd;
        }

        /* Grid Layout */
        .columns {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 32px;
            flex: 1;
            min-height: 0;
        }

        .column-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .column-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .column-desc {
            font-size: 14px;
            color: var(--text-sub);
            word-break: keep-all;
        }

        /* Column 1 - Data Input Specific */
        .input-card {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .table-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            color: #333;
            outline: none;
            cursor: pointer;
            background-color: white;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .section-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }

        .drop-zone {
            background-color: #f7fbff;
            border-radius: 12px;
            padding: 16px;
            min-height: 120px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-content: flex-start;
            border: 1px solid #edf2f7;
        }

        .drop-zone.select-zone {
            background-color: transparent;
            padding: 0;
            min-height: auto;
        }

        .attr-pill {
            background-color: white;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
        }

        .attr-pill.active {
            border-color: var(--primary-color);
            color: white;
            background-color: var(--primary-color);
        }

        .remove-icon {
            margin-left: 8px;
            font-size: 16px;
            line-height: 1;
            font-weight: normal;
        }

        .arrow-down {
            display: flex;
            justify-content: center;
            margin: -12px 0;
            position: relative;
            z-index: 10;
        }

        .arrow-down svg {
            width: 60px;
            height: 40px;
            fill: #e3f2fd;
        }

        /* Training Column */
        .train-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .train-top {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .algo-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .algo-name {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }

        .train-btn {
            background-color: #f8f9fa;
            color: #adb5bd;
            border: 1px solid #dee2e6;
            width: 100%;
            padding: 12px 0;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: not-allowed;
            margin-bottom: 10px;
        }

        .train-btn.ready {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            cursor: pointer;
        }

        .train-status {
            font-size: 12px;
            color: var(--primary-color);
            text-align: center;
        }

        .train-bottom {
            padding: 20px;
            background-color: #fdfdfd;
        }

        .condition-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            margin-bottom: 20px;
        }

        .condition-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .condition-label {
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .condition-tooltip {
            color: #adb5bd;
            font-size: 12px;
            cursor: help;
        }

        .condition-input {
            width: 80px;
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-align: right;
            font-family: inherit;
            outline: none;
        }

        .condition-input:focus {
            border-color: var(--primary-color);
        }


        /* Result Column Styling */
        .result-card {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .result-tabs {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #718096;
            cursor: pointer;
            position: relative;
        }

        .tab-btn.active {
            color: var(--primary-color);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--primary-color);
        }

        .tab-content {
            display: none;
            padding: 24px;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        .metric-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-label {
            font-size: 11px;
            color: #718096;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .confusion-matrix {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }

        .confusion-matrix th,
        .confusion-matrix td {
            border: 1px solid #e2e8f0;
            padding: 8px 4px;
            text-align: center;
        }

        .confusion-matrix th {
            background-color: #f8fafc;
            color: #4a5568;
            font-weight: 600;
        }

        .matrix-header-top {
            border: none !important;
            font-size: 11px;
            color: #718096;
            padding-bottom: 4px !important;
        }

        .matrix-header-left {
            border: none !important;
            writing-mode: vertical-lr;
            text-align: center;
            font-size: 11px;
            color: #718096;
            padding-right: 8px !important;
        }

        .highlight-diag {
            background-color: #ebf2ff;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Hide scrollbar for matrix container */
        #cm-table-container::-webkit-scrollbar {
            display: none;
        }
        #cm-table-container {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }

        .test-input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .test-input-row input {
            width: 60px;
            padding: 6px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-align: right;
        }

        .test-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
        }

        .test-btn:hover {
            background-color: #e9ecef;
        }

        .prediction-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        .prediction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .prediction-name {
            font-size: 14px;
            font-weight: 500;
        }

        .prediction-bar-bg {
            flex: 1;
            height: 8px;
            background: #f1f3f5;
            border-radius: 4px;
            margin: 0 12px;
            position: relative;
        }

        .prediction-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--primary-color);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s;
        }

        .prediction-perc {
            font-size: 13px;
            color: #999;
            width: 40px;
            text-align: right;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e0;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-left">
            <button class="close-btn" onclick="window.close()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
            <div class="nav-title" id="nav-title">분류: 숫자 (kNN) 모델 학습하기</div>
        </div>
        <button class="apply-btn" id="apply-btn" disabled>적용하기</button>
    </nav>

    <main>
        <div class="top-info">
            <span class="tutorial-link" id="view-tutorial">튜토리얼 보기</span>
        </div>

        <div class="model-name-wrapper">
            <input type="text" class="model-name-input" id="model-name" placeholder="새로운 모델">
        </div>

        <div class="columns">
            <!-- Column 1: 데이터 입력 -->
            <div class="column">
                <div class="column-header">
                    <div>
                        <div class="column-title" id="input-title">데이터 입력</div>
                        <div class="column-desc" id="input-desc">모델이 학습할 데이터를 입력합니다.</div>
                    </div>
                </div>

                <div class="input-card">
                    <select class="table-select" id="table-select" onchange="onTableSelect()">
                        <option value="" disabled selected id="select-table-placeholder">테이블을 선택해 주세요.</option>
                        <option value="test_table_1">아이리스 붓꽃 데이터세트</option>
                        <option value="test_table_2">날씨 데이터세트</option>
                    </select>

                    <div id="attribute-config" style="display: none; flex-direction: column; gap: 16px;">
                        <div>
                            <div class="section-title">핵심 속성</div>
                            <div class="section-desc">여기에 속성을 선택할 수 있습니다.</div>
                            <div class="drop-zone" id="core-attrs">
                                <!-- Attributes go here -->
                            </div>
                        </div>

                        <div class="arrow-down">
                            <svg viewBox="0 0 100 50">
                                <polygon points="0,0 100,0 50,40" />
                            </svg>
                        </div>

                        <div>
                            <div class="section-title">예측 속성</div>
                            <div class="section-desc">아래에서 분류할 클래스로 삼을 속성을 선택해 주세요.</div>
                            <div class="drop-zone select-zone">
                                <select class="table-select" id="predict-attr-select" onchange="updateTrainStatus()">
                                    <option value="" disabled selected id="select-predict-placeholder">클래스로 삼을 속성
                                    </option>
                                    <!-- Options go here -->
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 2: 학습 -->
            <div class="column">
                <div class="column-header" style="flex-direction:column;">
                    <div class="column-title" id="train-title">학습</div>
                    <div class="column-desc" id="train-desc">입력한 데이터로 모델을 학습합니다.</div>
                </div>

                <div class="train-card">
                    <div class="train-top">
                        <div class="algo-title" id="algo-title">알고리즘</div>
                        <div class="algo-name" id="algo-name">k-최근접 이웃(kNN)</div>
                        <button class="train-btn" id="train-btn" disabled>학습하기</button>
                        <div class="train-status" id="train-status">데이터를 먼저 입력해 주세요.</div>
                    </div>
                    <div class="train-bottom">
                        <div class="condition-title" id="condition-title">학습 조건</div>

                        <div class="condition-row">
                            <div class="condition-label">
                                <span id="label-neighbors">이웃 개수</span>
                                <span class="condition-tooltip">?</span>
                            </div>
                            <input type="number" class="condition-input" id="knn-k-value" value="2" min="1" max="10">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 3: 결과 -->
            <div class="column">
                <div class="column-header" style="flex-direction:column;">
                    <div class="column-title" id="result-title">결과</div>
                    <div class="column-desc" id="result-desc">학습한 모델의 결과를 확인합니다.</div>
                </div>

                <div class="result-card" style="background:white; border:1px solid var(--border-color); border-radius:8px; height:480px; overflow:hidden;">
                    <div class="result-tabs" id="result-tabs" style="display:none;">
                        <button class="tab-btn active" onclick="switchTab('test')" data-i18n="AiLearningTree.test_tab">테스트</button>
                        <button class="tab-btn" onclick="switchTab('eval')" data-i18n="AiLearningTree.eval_tab">평가</button>
                    </div>

                    <div class="result-placeholder" id="predict-placeholder" style="flex:1; display:flex; align-items:center; justify-content:center; color:var(--primary-color); font-size:14px; text-align:center;">
                        모델을 먼저 학습해 주세요.
                    </div>

                    <div id="content-test" class="tab-content">
                        <div id="test-inputs-container">
                            <!-- Dynamically add inputs based on core attributes -->
                        </div>
                        <div class="test-btn" id="test-btn">확인하기</div>

                        <div class="prediction-list" id="prediction-list">
                            <!-- Predictions show here -->
                        </div>
                    </div>

                    <div id="content-eval" class="tab-content">
                        <div class="metric-cards">
                            <div class="metric-card">
                                <div class="metric-label" data-i18n="AiLearningTree.accuracy">정확도</div>
                                <div class="metric-value" id="accuracy-val">0%</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label" data-i18n="AiLearningTree.f1_score">F1</div>
                                <div class="metric-value" id="f1-val">0.00</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label" data-i18n="AiLearningTree.precision">정밀도</div>
                                <div class="metric-value" id="precision-val">0.00</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label" data-i18n="AiLearningTree.recall">재현율</div>
                                <div class="metric-value" id="recall-val">0.00</div>
                            </div>
                        </div>

                        <div style="margin-top: 24px; font-weight: bold; font-size: 14px; margin-bottom: 16px;"
                            data-i18n="AiLearningTree.confusion_matrix">혼동 행렬</div>
                        <div id="cm-table-container" style="overflow-x: auto;">
                            <table class="confusion-matrix" id="cm-table">
                                <!-- Confusion matrix created dynamically -->
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const i18n = {
            en: {
                navTitle: "Classification: Numeric (kNN) Model Training",
                apply: "Apply",
                internetInfo: "Model training works correctly when connected to the internet.",
                tutorial: "View Tutorial",
                modelNamePlaceholder: "New Model",
                inputTitle: "Data Input",
                inputDesc: "Input the data the model will learn.",
                trainTitle: "Training",
                trainDesc: "Train the model with the input data.",
                resultTitle: "Result",
                resultDesc: "Check the results of the trained model.",
                trainBtn: "Train",
                trainStatusEmpty: "Please input data first.",
                trainStatusReady: "Ready to train.",
                trainStatusTraining: "Training...",
                trainStatusDone: "Training complete.",
                resultPlaceholder: "Please train the model first.",
                selectTablePlaceholder: "Please select a table.",
                selectPredictPlaceholder: "Attribute for class",
                algoTitle: "Algorithm",
                algoName: "k-Nearest Neighbors (kNN)",
                conditionTitle: "Training Conditions",
                labelNeighbors: "Number of Neighbors",
                testBtnText: "Check",
                predict: "Predicted",
                actual: "Actual"
            },
            ko: {
                navTitle: "분류: 숫자 (kNN) 모델 학습하기",
                apply: "적용하기",
                tutorial: "튜토리얼 보기",
                modelNamePlaceholder: "새로운 모델",
                inputTitle: "데이터 입력",
                inputDesc: "모델이 학습할 데이터를 입력합니다.",
                trainTitle: "학습",
                trainDesc: "입력한 데이터로 모델을 학습합니다.",
                resultTitle: "결과",
                resultDesc: "학습한 모델의 결과를 확인합니다.",
                trainBtn: "학습하기",
                trainStatusEmpty: "데이터를 먼저 입력해 주세요.",
                trainStatusReady: "학습 준비 완료",
                trainStatusTraining: "학습 중...",
                trainStatusDone: "학습 완료",
                resultPlaceholder: "모델을 먼저 학습해 주세요.",
                selectTablePlaceholder: "테이블을 선택해 주세요.",
                selectPredictPlaceholder: "클래스로 삼을 속성",
                algoTitle: "알고리즘",
                algoName: "k-최근접 이웃(kNN)",
                conditionTitle: "학습 조건",
                labelNeighbors: "이웃 개수",
                testBtnText: "확인하기",
                predict: "예측",
                actual: "실제"
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'ko';
        const t = i18n[lang] || i18n.ko;

        async function setupUI() {
            // Apply translations
            document.getElementById('nav-title').innerText = t.navTitle;
            document.getElementById('apply-btn').innerText = t.apply;
            const internetInfoEl = document.getElementById('internet-info');
            if (internetInfoEl) internetInfoEl.innerText = t.internetInfo;
            document.getElementById('view-tutorial').innerText = t.tutorial;
            document.getElementById('model-name').placeholder = t.modelNamePlaceholder;
            document.getElementById('input-title').innerText = t.inputTitle;
            document.getElementById('input-desc').innerText = t.inputDesc;
            document.getElementById('train-title').innerText = t.trainTitle;
            document.getElementById('train-desc').innerText = t.trainDesc;
            document.getElementById('result-title').innerText = t.resultTitle;
            document.getElementById('result-desc').innerText = t.resultDesc;
            document.getElementById('train-btn').innerText = t.trainBtn;
            document.getElementById('train-status').innerText = t.trainStatusEmpty;
            document.getElementById('predict-placeholder').innerText = t.resultPlaceholder;
            document.getElementById('select-table-placeholder').innerText = t.selectTablePlaceholder;
            document.getElementById('select-predict-placeholder').innerText = t.selectPredictPlaceholder;
            document.getElementById('algo-title').innerText = t.algoTitle;
            document.getElementById('algo-name').innerText = t.algoName;
            document.getElementById('condition-title').innerText = t.conditionTitle;
            document.getElementById('label-neighbors').innerText = t.labelNeighbors;
            document.getElementById('test-btn').innerText = t.testBtnText;

            tables = await loadTables();
            renderTableSelect();
        }

        window.addEventListener('load', setupUI);


        // Check for window.opener and fetch actual tables
        async function loadTables() {
            let foundTables = [];
            try {
                if (window.ipcInvoke) {
                    const res = await window.ipcInvoke('getEntryTables');
                    if (res && Array.isArray(res) && res.length > 0) {
                        foundTables = res.map(t => ({
                            id: t.id || Math.random().toString(36).substr(2, 9),
                            name: t.name || t.id,
                            fields: t.fields || (t.table ? t.table[0] : []),
                            data: t.data || (t.table ? t.table.slice(1) : [])
                        }));
                    }
                }
            } catch (e) {
                console.error("Error fetching tables via IPC:", e);
            }

            if (foundTables.length === 0) {
                const irisTable = {
                    id: 'iris_sample',
                    name: '붓꽃 예시 데이터',
                    fields: ['꽃받침 길이', '꽃받침 너비', '꽃잎 길이', '꽃잎 너비', '품종'],
                    data: [
                        [5.1, 3.5, 1.4, 0.2, 'setosa'], [4.9, 3.0, 1.4, 0.2, 'setosa'], [4.7, 3.2, 1.3, 0.2, 'setosa'], [4.6, 3.1, 1.5, 0.2, 'setosa'], [5.0, 3.6, 1.4, 0.2, 'setosa'],
                        [7.0, 3.2, 4.7, 1.4, 'versicolor'], [6.4, 3.2, 4.5, 1.5, 'versicolor'], [6.9, 3.1, 4.9, 1.5, 'versicolor'], [5.5, 2.3, 4.0, 1.3, 'versicolor'], [6.5, 2.8, 4.6, 1.5, 'versicolor'],
                        [6.3, 3.3, 6.0, 2.5, 'virginica'], [5.8, 2.7, 5.1, 1.9, 'virginica'], [7.1, 3.0, 5.9, 2.1, 'virginica'], [6.3, 2.9, 5.6, 1.8, 'virginica'], [6.5, 3.0, 5.8, 2.2, 'virginica']
                    ]
                };
                foundTables.push(irisTable);
            }

            return foundTables;
        }

        window.refreshTables = async function () { tables = await loadTables(); renderTableSelect(); };

        // Populate table select dropdown
        const tableSelect = document.getElementById('table-select');
        let selectedTableIndex = -1;
        let selectedCoreAttrs = [];
        let isTraining = false;
        let attrValueMaps = [];
        let actualClasses = [];

        function renderTableSelect() {
            if (!tableSelect) return;
            const currentSelected = tables[tableSelect.value] || tables[selectedTableIndex];
            tableSelect.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = ""; placeholder.disabled = true;
            placeholder.innerText = tables.length === 0 ? t.trainStatusEmpty : t.selectTablePlaceholder; // Using existing translations
            tableSelect.appendChild(placeholder);

            let isCurrentAvailable = false;
            tables.forEach((t, index) => {
                const opt = document.createElement('option');
                opt.value = index; opt.innerText = t.name;
                if (currentSelected && t.id === currentSelected.id && t.name === currentSelected.name) {
                    opt.selected = true;
                    isCurrentAvailable = true;
                }
                tableSelect.appendChild(opt);
            });

            if (tables.length === 1 && !isCurrentAvailable) {
                tableSelect.value = 0;
                onTableSelect();
            } else if (!isCurrentAvailable) {
                placeholder.selected = true;
                document.getElementById('attribute-config').style.display = 'none';
            } else {
                tableSelect.value = selectedTableIndex;
            }
        }

        // Initial render of table select


        function onTableSelect() {
            const tableIndex = tableSelect.value;
            const tableConfig = tables[tableIndex];
            if (!tableConfig) return;

            selectedTableIndex = tableIndex;
            document.getElementById('attribute-config').style.display = 'flex'; // Changed from 'block' to 'flex' to match original style
            selectedCoreAttrs = []; // Reset selected core attributes
            // The original code builds core attributes and predict select directly here.
            // We need to replicate that logic or call a helper function.

            // Build Core Attributes
            const coreContainer = document.getElementById('core-attrs');
            coreContainer.innerHTML = '';

            tableConfig.fields.forEach((field, index) => {
                // By default, first 4 attributes are selected in our mock
                if (index < (tableConfig.fields.length - 1)) {
                    const pill = document.createElement('div');
                    pill.className = 'attr-pill active';
                    pill.innerHTML = `<span>${field}</span><span class="remove-icon">×</span>`;
                    pill.dataset.index = index;
                    pill.onclick = () => toggleAttr(pill);
                    coreContainer.appendChild(pill);
                    selectedCoreAttrs.push(index);
                }
            });

            // Build Predict Attribute Select
            const predictSelect = document.getElementById('predict-attr-select');
            predictSelect.innerHTML = `<option value="" disabled id="select-predict-placeholder">${t.selectPredictPlaceholder}</option>`;

            tableConfig.fields.forEach((field, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.innerText = field;
                if (index === (tableConfig.fields.length - 1)) {
                    option.selected = true;
                }
                predictSelect.appendChild(option);
            updateTrainStatus();

            // Populate actualClasses for kNN
            const predictAttr = document.getElementById('predict-attr-select').value;
            const labels = new Set();
            tableConfig.data.forEach(row => labels.add(row[predictAttr]));
            actualClasses = Array.from(labels).sort();
        }

        function toggleAttr(pill) {
            const index = parseInt(pill.dataset.index);
            if (pill.classList.contains('active')) {
                pill.classList.remove('active');
                pill.innerHTML = `<span>${tables[selectedTableIndex].fields[index]}</span>`;
                selectedCoreAttrs = selectedCoreAttrs.filter(i => i !== index);
            } else {
                pill.classList.add('active');
                pill.innerHTML = `<span>${tables[selectedTableIndex].fields[index]}</span><span class="remove-icon">×</span>`;
                selectedCoreAttrs.push(index);
            }
            updateTrainStatus();
        }

        function updateTrainStatus() {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');
            const predictAttr = document.getElementById('predict-attr-select').value;

            if (selectedTableIndex !== -1 && selectedCoreAttrs.length > 0 && predictAttr !== "") {
                btn.classList.add('ready');
                btn.disabled = false;
                status.innerText = t.trainStatusReady;
            } else {
                btn.classList.remove('ready');
                btn.disabled = true;
                status.innerText = t.trainStatusEmpty;
        }

        document.getElementById('train-btn').onclick = async () => {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');

            btn.classList.remove('ready');
            btn.disabled = true;
            document.getElementById('apply-btn').disabled = true;
            status.innerText = t.trainStatusTraining;

            const tableConfig = tables[selectedTableIndex];
            if (!tableConfig) return;

            let hasMissing = false;
            // Robust data processing for categorical data
            attrValueMaps = selectedCoreAttrs.map(() => ({}));

            tableConfig.data.forEach(row => {
                selectedCoreAttrs.forEach((idx, i) => {
                    const val = row[idx];
                    if (val === undefined || val === null || val === "") {
                        hasMissing = true;
                        return;
                    }
                    if (!isNaN(parseFloat(val))) return;
                    const map = attrValueMaps[i];
                    if (map[val] === undefined) map[val] = Object.keys(map).length;
                });
                const predictAttr = document.getElementById('predict-attr-select').value;
                const label = row[predictAttr];
                if (label === undefined || label === null || label === "") {
                    hasMissing = true;
                }
            });

            if (hasMissing) {
                alert('결측치가 존재하여 학습을 중단합니다. 결측치를 처리한 후에 재학습을 진행하세요.');
                btn.classList.add('ready');
                btn.disabled = false;
                status.innerText = t.trainStatusReady;
                return;
            }

            // Mock training time
            await new Promise(r => setTimeout(r, 1000));

            isTraining = true;
            status.innerText = t.trainStatusDone;
            btn.classList.add('ready');
            btn.disabled = false;
            document.getElementById('apply-btn').disabled = false;

            // Generate mock evaluation for kNN
            const accuracy = 85 + Math.random() * 10;
            const precision = 0.82 + Math.random() * 0.1;
            const recall = 0.81 + Math.random() * 0.1;
            const f1 = 2 * (precision * recall) / (precision + recall);

            document.getElementById('accuracy-val').innerText = `${accuracy.toFixed(1)}%`;
            document.getElementById('precision-val').innerText = `${(precision * 100).toFixed(1)}%`;
            document.getElementById('recall-val').innerText = `${(recall * 100).toFixed(1)}%`;
            document.getElementById('f1-val').innerText = `${(f1 * 100).toFixed(1)}%`;

            // Mock confusion matrix data
            const size = actualClasses.length;
            const mockActual = [];
            const mockPredicted = [];
            for (let i = 0; i < 50; i++) {
                const a = Math.floor(Math.random() * size);
                const p = Math.random() > 0.8 ? Math.floor(Math.random() * size) : a;
                mockActual.push(a);
                mockPredicted.push(p);
            }
            renderConfusionMatrix(mockActual, mockPredicted);

            showResult();
        };

        function showResult() {
            document.getElementById('predict-placeholder').style.display = 'none';
            document.getElementById('result-tabs').style.display = 'flex';
            switchTab('test');
            document.getElementById('prediction-list').innerHTML = '';

            // Build test inputs based on selected core attributes
            const tableConfig = tables[selectedTableIndex];
            const testContainer = document.getElementById('test-inputs-container');
            testContainer.innerHTML = '';

            selectedCoreAttrs.forEach(index => {
                const fieldName = tableConfig.fields[index];
                const row = document.createElement('div');
                row.className = 'test-input-row';
                row.innerHTML = `
                    <label>${fieldName}</label>
                    <input type="text" placeholder="0">
                `;
                testContainer.appendChild(row);
            });
        }

        document.getElementById('test-btn').onclick = () => {
            if (!isTraining) return;

            // Mock predictions based on table
            let mockClasses = [];
            if (tables[selectedTableIndex].id === 'test_table_1') {
                mockClasses = ['setosa', 'versicolor', 'virginica'];
            } else {
                mockClasses = ['맑음', '흐림', '비'];
            }

            const result = mockClasses.map((className, index) => {
                return {
                    className: className,
                    probability: index === 0 ? 0.8 : (index === 1 ? 0.15 : 0.05) // Mock logic
                };
            }).sort((a, b) => b.probability - a.probability);

            renderPredictions(result);
        };

        function renderPredictions(probabilities) {
            const list = document.getElementById('prediction-list');
            list.innerHTML = '';

            probabilities.forEach((prob) => {
                const item = document.createElement('div');
                item.className = 'prediction-item';
                item.innerHTML = `
                    <div class="prediction-name">${prob.className}</div>
                    <div class="prediction-bar-bg">
                        <div class="prediction-bar-fill" style="width: ${prob.probability * 100}%"></div>
                    </div>
                    <div class="prediction-perc">${(prob.probability * 100).toFixed(0)}%</div>
                `;
                list.appendChild(item);
            });
        }

        function switchTab(tab) {
            ['test', 'eval'].forEach(t => {
                document.getElementById('tab-btn-' + t)?.classList.toggle('active', t === tab); // Fixed selector if needed, but let's check HTML
                // Actually my HTML used onclick="switchTab('test')" etc. but didn't have IDs on buttons. 
                // Let's use simpler logic if possible or update HTML.
                document.getElementById('content-' + t).classList.toggle('active', t === tab);
            });
            // Update button styles
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                if(btn.getAttribute('onclick').includes(tab)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function renderConfusionMatrix(actual, predicted) {
            const table = document.getElementById('cm-table');
            table.innerHTML = '';
            const classes = actualClasses;
            const size = classes.length;
            if (!classes || size === 0 || size > 10) return;

            // Create matrix data
            const matrix = Array(size).fill(0).map(() => Array(size).fill(0));
            actual.forEach((a, i) => {
                if (matrix[a] && matrix[a][predicted[i]] !== undefined) {
                    matrix[a][predicted[i]]++;
                }
            });

            let html = `<tr><th class="matrix-header-top"></th><th class="matrix-header-top"></th><th colspan="${size}" class="matrix-header-top" data-i18n="AiLearningTree.predict">${t.predict}</th></tr>
                        <tr><th rowspan="${size + 1}" class="matrix-header-left" data-i18n="AiLearningTree.actual">${t.actual}</th><th></th>`;
            classes.forEach(c => html += `<th>${c}</th>`);
            html += '</tr>';

            for (let i = 0; i < size; i++) {
                html += `<tr><th>${classes[i]}</th>`;
                for (let j = 0; j < size; j++) {
                    const val = matrix[i][j];
                    html += `<td class="${i === j ? 'highlight-diag' : ''}">${val}</td>`;
                }
                html += '</tr>';
            }
            table.innerHTML = html;
        }

        document.getElementById('apply-btn').onclick = async () => {
            const projectName = document.getElementById('model-name').value || t.modelNamePlaceholder;
            const kValue = parseInt(document.getElementById('knn-k-value').value) || 2;
            const predictAttr = document.getElementById('predict-attr-select').value;

            const modelData = {
                type: 'number',
                name: projectName,
                hyperparameters: {},
                trainParam: {
                    k: kValue,
                    neighbors: kValue
                },
                tableData: {
                    id: tables[selectedTableIndex].id,
                    name: tables[selectedTableIndex].name,
                    fields: tables[selectedTableIndex].fields,
                    data: tables[selectedTableIndex].data,
                    select: [selectedCoreAttrs, [parseInt(predictAttr)]]
                }
            };
            // To pass validation of modelData format in offline legacy code if needed:
            modelData.tableId = tables[selectedTableIndex].id;
            modelData.coreAttrs = selectedCoreAttrs;
            modelData.predictAttr = predictAttr;

            if (window.ipcSend) { window.ipcSend('trainComplete', modelData); window.close(); } else if (window.opener) {
                window.opener.postMessage({
                    type: 'trainComplete',
                    modelData: modelData
                }, '*');
                window.close();
            }
        };
    </script>
</body>

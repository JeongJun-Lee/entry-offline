<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-text">데이터 입력 - 소리</title>
    <style>
        @font-face {
            font-family: 'NanumGothic';
            src: url('../../renderer/resources/fonts/NanumGothic.ttf') format('truetype');
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'NanumGothic', sans-serif;
            background: #fff;
            margin: 0;
            padding: 0;
            color: #333;
            overflow: hidden;
        }
        .header {
            background: #2b6df3;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title { font-weight: 700; font-size: 18px; }
        .close-btn {
            background: none; border: none; color: white;
            font-size: 24px; cursor: pointer; line-height: 1;
        }
        .body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }

        .toprow { display: flex; gap: 10px; height: 48px; }
        .toprow select {
            width: 100%; height: 100%;
            padding: 0 28px 0 12px;
            border: 1px solid #dee2e6; border-radius: 6px;
            font-size: 15px; font-weight: 700;
            appearance: none; background: #fff; cursor: pointer;
            color: #495057;
        }
        .btn-icon {
            width: 48px; height: 100%;
            background: #5a87ff; color: white;
            border: none; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .btn-icon.recording { background: #ff4d4f; }
        .btn-icon[style*="display: none"] { display: none !important; }

        .editor {
            height: 120px; border: 1px solid #dee2e6;
            position: relative; background: #fff;
            overflow: hidden; cursor: default;
        }
        canvas { position: absolute; width: 100%; height: 100%; z-index: 1; }
        .overlay {
            position: absolute; top: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); z-index: 2; pointer-events: none;
        }
        .crop-handle {
            position: absolute; top: 0; bottom: 0; width: 2px;
            background: #ff4d4f; z-index: 3; cursor: ew-resize;
        }
        .crop-dot {
            position: absolute; left: 50%; width: 10px; height: 10px;
            border-radius: 50%; background: #ff4d4f;
            transform: translateX(-50%);
        }

        .botrow { display: flex; gap: 10px; height: 48px; }
        .play-btn {
            width: 72px; height: 100%;
            background: white; border: 1px solid #dee2e6;
            border-radius: 4px; cursor: not-allowed;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.3; transition: all 0.2s;
        }
        .play-btn.ready { opacity: 1; cursor: pointer; border-color: #5a87ff; }
        .apply-btn {
            flex: 1; height: 100%;
            background: #e9ecef; color: #adb5bd;
            border: none; border-radius: 4px;
            font-size: 16px; font-weight: 700; cursor: not-allowed;
            transition: all 0.2s;
        }
        .apply-btn.ready { background: #5a87ff; color: white; cursor: pointer; }
        .apply-btn:disabled {
            background-color: #e9ecef;
            color: #adb5bd;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #debug {
            font-size: 10px; color: #888; max-height: 60px;
            overflow-y: auto; font-family: monospace;
            display: none; /* set to block for debug */
        }
    </style>
</head>
<body>
<div class="header">
    <span class="header-title" id="header-title">데이터 입력</span>
    <button class="close-btn" id="closeBtn">&times;</button>
</div>
<div class="body">
    <div class="toprow">
        <div style="flex:1; position:relative;">
            <select id="modeSelect">
                <option value="record" id="option-record">Record</option>
                <option value="upload" id="option-upload">Upload</option>
            </select>
            <div style="position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>
        </div>
        <button class="btn-icon" id="recordBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <button class="btn-icon" id="uploadBtn" style="display:none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        </button>
        <input type="file" id="fileInput" accept="audio/*" style="display:none;">
    </div>

    <div class="editor" id="editor">
        <canvas id="canvas" width="440" height="120"></canvas>
        <div class="overlay" id="leftOverlay" style="left:0;width:0%;"></div>
        <div class="overlay" id="rightOverlay" style="right:0;width:0%;"></div>
        <div class="crop-handle" id="leftHandle" style="left:0;transform:translateX(-50%);">
            <div class="crop-dot" style="top:-5px;"></div>
            <div class="crop-dot" style="bottom:-5px;"></div>
        </div>
        <div class="crop-handle" id="rightHandle" style="right:0;transform:translateX(50%);">
            <div class="crop-dot" style="top:-5px;"></div>
            <div class="crop-dot" style="bottom:-5px;"></div>
        </div>
    </div>

    <div class="botrow">
        <button class="play-btn" id="playBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#dee2e6"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="apply-btn" id="applyBtn" disabled>적용</button>
    </div>
    <div id="debug"></div>
</div>

<!-- These scripts run in their own isolated BrowserWindow - no conflict with entry.js TF 1.7.4 -->
<script src="../../renderer/resources/lib/tensorflow/tf.min.js"></script>
<script src="../../renderer/resources/lib/tensorflow/speech-commands.min.js"></script>
<script>
(async function() {
    let Lang = {};
    function loadLang() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang');

            if (!lang) {
                const rawPersist = localStorage.getItem('persist:storage');
                if (rawPersist) {
                    try {
                        lang = JSON.parse(JSON.parse(rawPersist).persist).lang;
                    } catch (e) { }
                }
            }
            lang = lang || 'ko';

            function deepMerge(target, source) {
                for (const key in source) {
                    if (source[key] instanceof Object && key in target && !(source[key] instanceof Array)) {
                        deepMerge(target[key], source[key]);
                    } else {
                        target[key] = source[key];
                    }
                }
                return target;
            }

            const xhrEn = new XMLHttpRequest();
            xhrEn.open('GET', `../../renderer/resources/lang/en.json`, false);
            xhrEn.send();
            if (xhrEn.status === 200) {
                Lang = JSON.parse(xhrEn.responseText);
            }

            if (lang !== 'en') {
                const xhrLang = new XMLHttpRequest();
                xhrLang.open('GET', `../../renderer/resources/lang/${lang}.json`, false);
                xhrLang.send();
                if (xhrLang.status === 200) {
                    const localized = JSON.parse(xhrLang.responseText);
                    deepMerge(Lang, localized);
                }
            }
        } catch (e) {
            console.error("Failed to load language file", e);
        }
    }

    function getMsg(key) {
        if (!key) return '';
        const keys = key.split('.');
        let obj = Lang;
        for (const k of keys) {
            if (!obj || obj[k] === undefined) return key;
            obj = obj[k];
        }
        return obj;
    }

    function applyI18n() {
        document.getElementById('title-text').innerText = `${getMsg('AiLearning.data_input')} - ${getMsg('AiLearning.speech_title')}`;
        document.getElementById('header-title').innerText = getMsg('AiLearning.data_input');
        document.getElementById('option-record').innerText = getMsg('AiLearning.mode_record');
        document.getElementById('option-upload').innerText = getMsg('AiLearning.mode_upload');
        document.getElementById('applyBtn').innerText = getMsg('AiLearning.apply');
    }

    loadLang();
    applyI18n();

    const params = new URLSearchParams(window.location.search);
    const recordTime = parseInt(params.get('recordTime') || '3000', 10);
    const labels = JSON.parse(decodeURIComponent(params.get('labels') || '[]'));

    const dlog = (msg) => {
        const d = document.getElementById('debug');
        if (d) d.textContent += msg + '\n';
        console.log('[SpeechPopup]', msg);
    };

    const modeSelect = document.getElementById('modeSelect');
    const recordBtn  = document.getElementById('recordBtn');
    const uploadBtn  = document.getElementById('uploadBtn');
    const fileInput  = document.getElementById('fileInput');
    const canvas     = document.getElementById('canvas');
    const editor     = document.getElementById('editor');
    const leftHandle   = document.getElementById('leftHandle');
    const rightHandle  = document.getElementById('rightHandle');
    const leftOverlay  = document.getElementById('leftOverlay');
    const rightOverlay = document.getElementById('rightOverlay');
    const playBtn  = document.getElementById('playBtn');
    const applyBtn = document.getElementById('applyBtn');
    const closeBtn = document.getElementById('closeBtn');

    // State
    let isRecording = false;
    let recordedAudioBuffer = null;
    let capturedSpec = null; // { data: Float32Array, frameSize: number }
    let recognizer = null;
    let transferRecognizer = null;
    let recordStream = null;
    let actualRecordTime = recordTime < 100 ? recordTime * 1000 : recordTime;
    if (actualRecordTime <= 0) actualRecordTime = 3000;

    // Crop handles
    let leftRatio = 0.0, rightRatio = 1.0;
    let isDraggingLeft = false, isDraggingRight = false;

    leftHandle.addEventListener('mousedown', e => { isDraggingLeft = true; e.preventDefault(); });
    rightHandle.addEventListener('mousedown', e => { isDraggingRight = true; e.preventDefault(); });
    window.addEventListener('mouseup', () => { isDraggingLeft = false; isDraggingRight = false; });
    window.addEventListener('mousemove', e => {
        if (!isDraggingLeft && !isDraggingRight) return;
        const rect = editor.getBoundingClientRect();
        let r = (e.clientX - rect.left) / rect.width;
        r = Math.max(0, Math.min(1, r));
        if (isDraggingLeft) {
            if (r >= rightRatio - 0.05) r = rightRatio - 0.05;
            leftRatio = r;
            leftHandle.style.left = `${r * 100}%`;
            leftOverlay.style.width = `${r * 100}%`;
        } else {
            if (r <= leftRatio + 0.05) r = leftRatio + 0.05;
            rightRatio = r;
            rightHandle.style.right = `${(1 - r) * 100}%`;
            rightOverlay.style.width = `${(1 - r) * 100}%`;
        }
    });

    const ipcSend   = window.ipcSend;
    const ipcInvoke = window.ipcInvoke;

    window.addEventListener('beforeunload', () => {
        stopAll();
        if (ipcSend) ipcSend('speechInputClose');
    });

    closeBtn.addEventListener('click', () => {
        window.close();
    });

    modeSelect.addEventListener('change', () => {
        if (modeSelect.value === 'upload') {
            recordBtn.style.display = 'none';
            uploadBtn.style.display = 'flex';
        } else {
            recordBtn.style.display = 'flex';
            uploadBtn.style.display = 'none';
        }
    });
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
        alert(getMsg('AiLearning.upload_error_msg'));
    });

    function drawWaveform(amplitude, useCanvas) {
        const ctx = useCanvas.getContext('2d');
        ctx.clearRect(0, 0, useCanvas.width, useCanvas.height);
        const num = amplitude.length;
        const step = useCanvas.width / num;
        const bw = Math.max(1, step * 0.8);
        ctx.fillStyle = '#ffb800';
        for (let i = 0; i < num; i++) {
            const bh = Math.min((amplitude[i] / 255) * useCanvas.height * 1.5, useCanvas.height * 0.9);
            ctx.fillRect(i * step, (useCanvas.height - bh) / 2, bw, Math.max(2, bh));
        }
    }

    function setReady(ready) {
        playBtn.classList.toggle('ready', ready);
        applyBtn.classList.toggle('ready', ready);
        applyBtn.disabled = !ready;
        if (ready) {
            playBtn.querySelector('svg').setAttribute('fill', '#5a87ff');
        }
    }

    function stopAll() {
        isRecording = false;
        if (recordStream) { recordStream.getTracks().forEach(t => t.stop()); recordStream = null; }
    }

    async function sliceAudioBuffer(buffer, leftR, rightR) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedBuffer = buffer;
        
        const startSample = Math.floor(leftR * decodedBuffer.length);
        const endSample = Math.floor(rightR * decodedBuffer.length);
        const frameCount = Math.max(1, endSample - startSample);
        
        dlog(`Cropping audio: leftRatio=${leftR}, rightRatio=${rightR}, startSample=${startSample}, endSample=${endSample}`);
        
        const croppedBuffer = audioCtx.createBuffer(
            decodedBuffer.numberOfChannels,
            frameCount,
            decodedBuffer.sampleRate
        );
        
        for (let channel = 0; channel < decodedBuffer.numberOfChannels; channel++) {
            const nowBuffering = croppedBuffer.getChannelData(channel);
            const originalData = decodedBuffer.getChannelData(channel);
            for (let i = 0; i < frameCount; i++) {
                nowBuffering[i] = originalData[startSample + i] || 0;
            }
        }
        
        return { audioCtx, croppedBuffer };
    }

    playBtn.addEventListener('click', async () => {
        if (!applyBtn.classList.contains('ready') || !recordedAudioBuffer) return;
        
        // Stop any ongoing playback
        if (window._currentAudioSource) {
            try { window._currentAudioSource.stop(); } catch(e){}
        }
        
        const { audioCtx, croppedBuffer } = await sliceAudioBuffer(recordedAudioBuffer, leftRatio, rightRatio);
        
        const source = audioCtx.createBufferSource();
        source.buffer = croppedBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
        window._currentAudioSource = source;
    });

    applyBtn.addEventListener('click', async () => {
        if (!applyBtn.classList.contains('ready') || !recordedAudioBuffer) return;
        
        try {
            dlog('Cropping and extracting features...');
            const { croppedBuffer } = await sliceAudioBuffer(recordedAudioBuffer, leftRatio, rightRatio);
            
            if (!recognizer) await initEngine();
            // Create a FRESH transfer recognizer each time to avoid stale state
            const freshTransfer = recognizer.createTransfer('apply_temp_' + Date.now());
            
            // Generate EXACTLY 1 second of spectrogram from cropped buffer.
            // By passing audioBuffer directly, speech-commands evaluates offline instead of listening to the microphone!
             await freshTransfer.collectExample('input', { audioBuffer: croppedBuffer });
            
            const examples = freshTransfer.getExamples('input');
            if (examples && examples.length > 0) {
                const spec = examples[examples.length - 1].example.spectrogram;
                const data = spec.data;
                const frameSize = spec.frameSize;
                
                // No need to manually crop the spectrogram again, because we already sliced the audio!
                // We just pass the extracted spectrogram directly.
                const floatData = new Float32Array(data);
                
                dlog(`Spectrogram generated: length=${floatData.length}, frameSize=${frameSize}`);
                if (ipcSend) {
                    ipcSend('speechInputResult', {
                        data: Array.from(floatData),
                        frameSize: frameSize,
                    });
                    stopAll();
                    window.close();
                }
            } else {
                alert(getMsg('AiLearning.feature_extraction_error'));
            }
        } catch(e) {
            dlog(`Apply error: ${e}`);
            console.error('Apply error details:', e);
            alert(getMsg('AiLearning.recognition_error') + e.message);
        }
    });

    // ── RECORDING ────────────────────────────────────────────────────────────
    // Fetch shim: redirect http://localhost/speech-commands/* to local files via IPC
    const originalFetch = window.fetch;
    window.fetch = async function(url, options) {
        const urlStr = typeof url === 'string' ? url : (url instanceof URL ? url.href : '');
        if (urlStr.includes('http://localhost/speech-commands/') || urlStr.includes('http://localhost/model.json')) {
            const relative = urlStr.split('/').pop();
            dlog(`Fetch shim: intercepting ${relative}`);
            try {
                const res = await ipcInvoke('local-fetch', `speech-commands/${relative}`);
                return new Response(res, { status: 200 });
            } catch(e) {
                dlog(`Fetch shim failed: ${e}`);
            }
        }
        return originalFetch.call(this, url, options);
    };

    async function initEngine() {
        if (!window.speechCommands) throw new Error('speechCommands not loaded');
        if (recognizer) return;

        const modelUrl    = 'http://localhost/speech-commands/model.json';
        const metadataUrl = 'http://localhost/speech-commands/metadata.json';
        dlog('Loading recognizer...');
        recognizer = window.speechCommands.create('BROWSER_FFT', null, modelUrl, metadataUrl);
        await recognizer.ensureModelLoaded();
        transferRecognizer = recognizer.createTransfer('popup_temp');
        dlog('Engine Ready!');
    }

    initEngine().catch(e => dlog(`Engine error: ${e}`));

    recordBtn.addEventListener('click', async () => {
        if (isRecording) return;
        isRecording = true;
        recordedAudioBuffer = null;
        capturedSpec = null;
        recordBtn.classList.add('recording');
        leftRatio = 0; rightRatio = 1;
        leftHandle.style.left = '0%'; leftOverlay.style.width = '0%';
        rightHandle.style.right = '0%'; rightOverlay.style.width = '0%';
        setReady(false);
        dlog('Recording started...');

        // Media recording setup
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordStream = stream;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        const source   = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 256;
        const dataArr = new Uint8Array(analyser.frequencyBinCount);

        // Setup ScriptProcessor for 100% synced PCM capture
        const processor = audioCtx.createScriptProcessor(4096, 1, 1);
        const pcmChunks = [];
        processor.onaudioprocess = (e) => {
            if (!isRecording) return;
            const channelData = e.inputBuffer.getChannelData(0);
            pcmChunks.push(new Float32Array(channelData));
        };
        source.connect(processor);
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0; // Prevent howling
        processor.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const ampHistory = [];
        let maxAmp = 0;
        const ctx = canvas.getContext('2d');

        let lastLiveWf = new Array(100).fill(0);
        const msPerBar = actualRecordTime / 100;
        let nextBarTime = msPerBar;
        let lastBarIdx = 0; // Track the current position to write (left to right)
        const startTime = Date.now();
        const drawLive = () => {
            if (!isRecording) return;
            requestAnimationFrame(drawLive);
            analyser.getByteTimeDomainData(dataArr);
            let m = 0;
            for (let i = 0; i < dataArr.length; i++) {
                const v = Math.abs(dataArr[i] - 128) / 128;
                if (v > m) m = v;
            }
            const amp = Math.min(255, m * 255 * 3);
            ampHistory.push(amp);
            const elapsed = Math.min(Date.now() - startTime, actualRecordTime);
            // Increment index left-to-right instead of scrolling
            while (elapsed >= nextBarTime && lastBarIdx < 100) {
                lastLiveWf[lastBarIdx] = amp;
                lastBarIdx++;
                nextBarTime += msPerBar;
            }
            drawWaveform(lastLiveWf, canvas);
        };
        drawLive();

        setTimeout(() => {
            isRecording = false;
            recordBtn.classList.remove('recording');
            if (recordStream) recordStream.getTracks().forEach(t => t.stop());
            processor.disconnect();
            gainNode.disconnect();
            
            // Stitch the PCM chunks into an AudioBuffer
            const totalLength = pcmChunks.reduce((acc, val) => acc + val.length, 0);
            recordedAudioBuffer = audioCtx.createBuffer(1, totalLength, audioCtx.sampleRate);
            const channelData = recordedAudioBuffer.getChannelData(0);
            let offset = 0;
            for (let i = 0; i < pcmChunks.length; i++) {
                channelData.set(pcmChunks[i], offset);
                offset += pcmChunks[i].length;
            }
            
            dlog('Recording complete.');
            // Stretch all collected amplitude data to fill 100 bars
            const finalWf = new Array(100).fill(0);
            if (ampHistory.length > 0) {
                for (let i = 0; i < 100; i++) {
                    const srcIdx = (ampHistory.length - 1) * (i / 99);
                    const lo = Math.floor(srcIdx);
                    const hi = Math.min(lo + 1, ampHistory.length - 1);
                    const t = srcIdx - lo;
                    finalWf[i] = ampHistory[lo] * (1 - t) + ampHistory[hi] * t;
                }
            }
            drawWaveform(finalWf, canvas);
            setReady(true);
        }, actualRecordTime);
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예측: 숫자 (선형 회귀) 모델 학습하기</title>
    <style>
        @font-face {
            font-family: 'NanumGothic';
            src: url('../../renderer/resources/fonts/NanumGothic.ttf') format('truetype');
        }

        :root {
            --primary-color: #4f80ff;
            --secondary-color: #f1f3f5;
            --text-main: #333;
            --text-sub: #666;
            --bg-body: #f7faff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --accent-blue: #ebf2ff;
        }

        body {
            font-family: 'NanumGothic', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styles */
        nav {
            background-color: #fff;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            height: 60px;
            box-sizing: border-box;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn svg {
            width: 24px;
            height: 24px;
            fill: #adb5bd;
        }

        .nav-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .apply-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .apply-btn:hover {
            background-color: #3b66d6;
        }

        /* Main Content */
        main {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .tutorial-link {
            color: var(--text-main);
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }

        .model-name-wrapper {
            background: white;
            padding: 12px 20px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            width: 380px;
        }

        .model-name-input {
            border: none;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            outline: none;
            color: #333;
        }

        .model-name-input::placeholder {
            color: #adb5bd;
        }

        /* Grid Layout */
        .columns {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 32px;
            flex: 1;
            min-height: 0;
        }

        .column-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .column-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .column-desc {
            font-size: 14px;
            color: var(--text-sub);
            word-break: keep-all;
        }

        /* Column 1 - Data Input Specific */
        .input-card {
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .table-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            color: #333;
            outline: none;
            cursor: pointer;
            background-color: white;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .section-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }

        .drop-zone {
            background-color: #f1f8fc;
            border-radius: 8px;
            padding: 16px;
            min-height: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
        }

        .drop-zone.select-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-weight: 500;
        }

        .attr-pill {
            background-color: white;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
        }

        .attr-pill.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: var(--accent-blue);
        }

        .attr-pill.predict {
            border-color: #adb5bd;
            color: #333;
            background-color: #e9ecef;
            cursor: default;
        }

        .arrow-down {
            display: flex;
            justify-content: center;
            margin: -12px 0;
            position: relative;
            z-index: 10;
        }

        .arrow-down svg {
            width: 60px;
            height: 40px;
            fill: #e3f2fd;
        }

        /* Training Column */
        .train-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .train-top {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .algo-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .algo-name {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }

        .train-btn {
            background-color: #f8f9fa;
            color: #adb5bd;
            border: 1px solid #dee2e6;
            width: 100%;
            padding: 12px 0;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: not-allowed;
            margin-bottom: 10px;
        }

        .train-btn.ready {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            cursor: pointer;
        }

        .train-status {
            font-size: 12px;
            color: var(--primary-color);
            text-align: center;
        }

        .train-bottom {
            padding: 20px;
            background-color: #fdfdfd;
        }

        .condition-title {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            margin-bottom: 20px;
        }

        .condition-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .condition-label {
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .condition-tooltip {
            color: #adb5bd;
            font-size: 12px;
            cursor: help;
        }

        .condition-input {
            width: 80px;
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-align: right;
            font-family: inherit;
            outline: none;
        }

        .condition-input:focus {
            border-color: var(--primary-color);
        }


        /* Result Column */
        .result-container {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 480px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 24px;
        }

        .result-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-size: 14px;
            text-align: center;
        }

        .preview-area {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .test-input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .test-input-row input {
            width: 80px;
            padding: 6px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-align: right;
        }

        .test-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
        }

        .test-btn:hover {
            background-color: #e9ecef;
        }

        .prediction-result-view {
            flex: 1;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .prediction-result-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e0;
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-left">
            <button class="close-btn" onclick="window.close()">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
            <div class="nav-title" id="nav-title">예측: 숫자 (선형 회귀) 모델 학습하기</div>
        </div>
        <button class="apply-btn" id="apply-btn">적용하기</button>
    </nav>

    <main>
        <div class="top-info">
            <span id="internet-info">모델 학습은 인터넷이 연결되어 있어야 정상적으로 동작합니다.</span>
            <span class="tutorial-link" id="view-tutorial">튜토리얼 보기</span>
        </div>

        <div class="model-name-wrapper">
            <input type="text" class="model-name-input" id="model-name" placeholder="새로운 모델">
        </div>

        <div class="columns">
            <!-- Column 1: 데이터 입력 -->
            <div class="column">
                <div class="column-header">
                    <div>
                        <div class="column-title" id="input-title">데이터 입력</div>
                        <div class="column-desc" id="input-desc">모델이 학습할 데이터를 입력합니다.</div>
                    </div>
                </div>

                <div class="input-card">
                    <select class="table-select" id="table-select" onchange="onTableSelect()">
                        <option value="" disabled selected id="select-table-placeholder">테이블을 선택해 주세요.</option>
                        <option value="test_table_1">아이리스 붓꽃 데이터세트</option>
                        <option value="test_table_2">날씨 데이터세트</option>
                        <option value="test_table_3">집값 예측 데이터세트</option>
                    </select>

                    <div id="attribute-config" style="display: none; flex-direction: column; gap: 16px;">
                        <div>
                            <div class="section-title">핵심 속성</div>
                            <div class="section-desc">여기에 속성을 끌어다 놓을 수 있습니다.</div>
                            <div class="drop-zone" id="core-attrs">
                                <!-- Attributes go here -->
                            </div>
                        </div>

                        <div class="arrow-down">
                            <svg viewBox="0 0 100 50">
                                <polygon points="0,0 100,0 50,40" />
                            </svg>
                        </div>

                        <div>
                            <div class="section-title">예측 속성</div>
                            <div class="drop-zone select-zone" id="predict-attr-zone">
                                <!-- Predict Attribute goes here -->
                                여기에 속성을 끌어다 놓을 수 있습니다.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 2: 학습 -->
            <div class="column">
                <div class="column-header" style="flex-direction:column;">
                    <div class="column-title" id="train-title">학습</div>
                    <div class="column-desc" id="train-desc">입력한 데이터로 모델을 학습합니다.</div>
                </div>

                <div class="train-card">
                    <div class="train-top">
                        <div class="algo-title" id="algo-title">알고리즘</div>
                        <div class="algo-name" id="algo-name">선형 회귀</div>
                        <button class="train-btn" id="train-btn">학습하기</button>
                        <div class="train-status" id="train-status">데이터를 먼저 입력해 주세요.</div>
                    </div>
                    <div class="train-bottom">
                        <div class="condition-title" id="condition-title">학습 조건</div>

                        <div class="condition-row">
                            <div class="condition-label">
                                <span id="label-epochs">에포크</span>
                                <span class="condition-tooltip">?</span>
                            </div>
                            <input type="number" class="condition-input" id="reg-epochs" value="30">
                        </div>
                        <div class="condition-row">
                            <div class="condition-label">
                                <span id="label-batch-size">배치 크기</span>
                                <span class="condition-tooltip">?</span>
                            </div>
                            <input type="number" class="condition-input" id="reg-batch-size" value="16">
                        </div>
                        <div class="condition-row">
                            <div class="condition-label">
                                <span id="label-learning-rate">학습률</span>
                                <span class="condition-tooltip">?</span>
                            </div>
                            <input type="number" step="0.01" class="condition-input" id="reg-learning-rate"
                                value="0.03">
                        </div>
                        <div class="condition-row">
                            <div class="condition-label">
                                <span id="label-val-ratio">검증 데이터 비율</span>
                                <span class="condition-tooltip">?</span>
                            </div>
                            <input type="number" step="0.01" class="condition-input" id="reg-val-ratio" value="0.25">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Column 3: 결과 -->
            <div class="column">
                <div class="column-header" style="flex-direction:column;">
                    <div class="column-title" id="result-title">결과</div>
                    <div class="column-desc" id="result-desc">학습한 모델의 결과를 확인합니다.</div>
                </div>

                <div class="result-container">
                    <div class="result-placeholder" id="predict-placeholder">
                        모델을 먼저 학습해 주세요.
                    </div>
                    <div class="preview-area" id="preview-area">
                        <div id="test-inputs-container">
                            <!-- Dynamically add inputs based on core attributes -->
                        </div>
                        <div class="test-btn" id="test-btn">확인하기</div>

                        <div class="prediction-result-view" id="prediction-result-view">
                            <div style="font-size:14px; color:#666; margin-bottom: 8px;">예측 결과:</div>
                            <div class="prediction-result-value" id="prediction-result-value">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

            const currentSelected = tables[tableSelect.value] || tables[selectedTableIndex];
            tableSelect.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.value = ""; placeholder.disabled = true;
            placeholder.innerText = tables.length === 0 ? getMsg('AiLearningTree.no_data') : getMsg('AiLearningTree.select_training_data');
            tableSelect.appendChild(placeholder);

            let isCurrentAvailable = false;
            tables.forEach((t, index) => {
                const opt = document.createElement('option');
                opt.value = index; opt.innerText = t.name;
                if (currentSelected && t.id === currentSelected.id && t.name === currentSelected.name) {
                    opt.selected = true;
                    isCurrentAvailable = true;
                }
                tableSelect.appendChild(opt);
            });

            if (tables.length === 1 && !isCurrentAvailable) {
                tableSelect.value = 0;
                onTableSelect();
            } else if (!isCurrentAvailable) {
                placeholder.selected = true;
                document.getElementById('attribute-config').style.display = 'none';
            } else {
                tableSelect.value = selectedTableIndex;
            }
        }

        let selectedTableIndex = -1;

        let selectedCoreAttrs = [];
        let unselectedAttrs = []; // Added for the new onTableSelect logic
        let predictAttrValue = null;
        let isTraining = false;

        function onTableSelect() {
            const tableIndex = tableSelect.value;
            const tableConfig = tables[tableIndex];
            if (!tableConfig) return;

            selectedTableIndex = tableIndex;
            document.getElementById('attribute-config').style.display = 'block';
            selectedCoreAttrs = []; unselectedAttrs = tableConfig.fields.map((_, i) => i); predictAttrValue = "";
            renderAttrs(); updateTrainStatus(); resetResult();
        }

        // Placeholder for renderAttrs and resetResult, assuming they will be defined elsewhere
        function renderAttrs() {
            // This function would typically render the attribute pills based on selectedCoreAttrs and unselectedAttrs
            // For now, we'll keep the original logic for attribute display as a fallback or if it's intended to be replaced later.
            const tableConfig = tables[selectedTableIndex];
            if (!tableConfig) return;

            const coreContainer = document.getElementById('core-attrs');
            coreContainer.innerHTML = '';
            // selectedCoreAttrs = []; // This is now initialized in onTableSelect
            // predictAttrValue = null; // This is now initialized in onTableSelect

            const lastIndex = tableConfig.fields.length - 1;

            tableConfig.fields.forEach((field, index) => {
                if (index < lastIndex) {
                    const pill = document.createElement('div');
                    pill.className = 'attr-pill active';
                    pill.innerText = field;
                    pill.dataset.index = index;
                    pill.onclick = () => toggleAttr(pill);
                    coreContainer.appendChild(pill);
                    selectedCoreAttrs.push(index);
                } else {
                    // Make the last attribute the predict attribute
                    predictAttrValue = index;
                    const predictZone = document.getElementById('predict-attr-zone');
                    predictZone.innerHTML = '';

                    const predictPill = document.createElement('div');
                    predictPill.className = 'attr-pill predict';
                    predictPill.innerText = field;
                    predictZone.appendChild(predictPill);
                }
            });

            updateTrainStatus();
        }

        function toggleAttr(pill) {
            const index = parseInt(pill.dataset.index);
            if (pill.classList.contains('active')) {
                pill.classList.remove('active');
                selectedCoreAttrs = selectedCoreAttrs.filter(i => i !== index);
            } else {
                pill.classList.add('active');
                selectedCoreAttrs.push(index);
            }
            updateTrainStatus();
        }

        function updateTrainStatus() {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');

            if (selectedTableIndex !== -1 && selectedCoreAttrs.length > 0 && predictAttrValue !== "") {
                btn.classList.add('ready');
                btn.disabled = false;
                status.innerText = t.trainStatusReady;
            } else {
                btn.classList.remove('ready');
                btn.disabled = true;
                status.innerText = t.trainStatusEmpty;
            }
        }

        document.getElementById('train-btn').onclick = async () => {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');

            btn.classList.remove('ready');
            btn.disabled = true;
            status.innerText = t.trainStatusTraining;

            // Mock training time
            await new Promise(r => setTimeout(r, 2000));

            isTraining = true;
            status.innerText = t.trainStatusDone;
            btn.classList.add('ready');
            btn.disabled = false;

            showResult();
        };

        function showResult() {
            document.getElementById('predict-placeholder').style.display = 'none';
            document.getElementById('preview-area').style.display = 'flex';
            document.getElementById('prediction-result-value').innerText = '-';

            // Build test inputs based on selected core attributes
            const tableConfig = tables[selectedTableIndex];
            const testContainer = document.getElementById('test-inputs-container');
            testContainer.innerHTML = '';

            selectedCoreAttrs.forEach(index => {
                const fieldName = tableConfig.fields[index];
                const row = document.createElement('div');
                row.className = 'test-input-row';
                row.innerHTML = `
                    <label>${fieldName}</label>
                    <input type="text" placeholder="0" class="test-val-input">
                `;
                testContainer.appendChild(row);
            });
        }

        document.getElementById('test-btn').onclick = () => {
            if (!isTraining) return;

            // Simple mock evaluation
            let sum = 0;
            document.querySelectorAll('.test-val-input').forEach(input => {
                sum += (parseFloat(input.value) || 0) * (Math.random() * 2);
            });

            // Adjust sum based on table to make it look realistic
            let result = 0;
            if (tables[selectedTableIndex].id === 'test_table_3') {
                result = 50000 + (sum * 1000) + Math.floor(Math.random() * 5000); // House price mock
            } else {
                result = sum + (Math.random() * 10);
            }

            document.getElementById('prediction-result-value').innerText = result.toFixed(2);
        };

        document.getElementById('apply-btn').onclick = () => {
            const projectName = document.getElementById('model-name').value || t.modelNamePlaceholder;

            // Hyperparameters
            const epochs = parseInt(document.getElementById('reg-epochs').value) || 30;
            const batchSize = parseInt(document.getElementById('reg-batch-size').value) || 16;
            const learningRate = parseFloat(document.getElementById('reg-learning-rate').value) || 0.03;
            const valRatio = parseFloat(document.getElementById('reg-val-ratio').value) || 0.25;

            const modelData = {
                type: 'regression',
                name: projectName,
                hyperparameters: {},
                trainParam: {
                    epochs: epochs,
                    batchSize: batchSize,
                    learningRate: learningRate,
                    validationRate: valRatio
                },
                tableData: {
                    id: tables[selectedTableIndex].id,
                    name: tables[selectedTableIndex].name,
                    fields: tables[selectedTableIndex].fields,
                    data: tables[selectedTableIndex].data,
                    select: [selectedCoreAttrs, [parseInt(predictAttrValue)]]
                }
            };
            modelData.tableId = tables[selectedTableIndex].id;
            modelData.coreAttrs = selectedCoreAttrs;
            modelData.predictAttr = predictAttrValue;

            if (window.opener) {
                window.opener.postMessage({
                    type: 'trainComplete',
                    modelData: modelData
                }, '*');
                window.close();
            }
        };
    </script>
</body>

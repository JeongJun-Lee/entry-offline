<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분류: 소리 모델 학습하기</title>
    <style>
        @font-face {
            font-family: 'NanumGothic';
            src: url('../../renderer/resources/fonts/NanumGothic.ttf') format('truetype');
        }
        .crop-handle {
            position: absolute;
            top: 0; bottom: 0; width: 2px;
            background: #ff4d4f; z-index: 3;
            cursor: ew-resize; transform: translateX(-50%);
        }
        .crop-handle-dot {
            position: absolute; left: 50%;
            width: 10px; height: 10px;
            border-radius: 50%; background: #ff4d4f;
            transform: translate(-50%, 0);
        }
        .crop-handle-dot.top { top: -5px; }
        .crop-handle-dot.bottom { bottom: -5px; }

            --secondary-color: #f1f3f5;

            --text-sub: #666;

            height: 60px;

            align-items: center;
            gap: 16px;
        }

        .close-btn {

            border: none;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffb800;

        .nav-title {

        .result-box-top {

    <!-- Load TensorFlow.js and Speech Commands for offline use -->
    <script>
        window.__module = window.module;
        window.__exports = window.exports;
        window.__require = window.require;
        window.__process = window.process;
        
        // Hide from libraries to force Browser mode, but keep as undefined to avoid ReferenceError
        window.module = undefined;
        window.exports = undefined;
        window.require = undefined;
        window.process = undefined;

        // Resolve absolute path for local resources
        window.getAbsolutePath = (relativePath, withScheme = true) => {
            const path = window.location.pathname;
            const dir = path.substring(0, path.lastIndexOf('/'));
            const decodedDir = decodeURIComponent(dir);
            const baseDir = decodedDir.substring(0, decodedDir.lastIndexOf('/'));
            
            // Use shadowed process if available, fallback to __process
            const currentProcess = window.process || window.__process || {};
            const platform = currentProcess.platform || 'darwin';

            let cleanBaseDir = baseDir;
            if (platform === 'win32' && cleanBaseDir.startsWith('/')) {
                cleanBaseDir = cleanBaseDir.substring(1);
            }
            const fullPath = `${cleanBaseDir}/resources/lib/tensorflow/models/speech-commands/${relativePath}`;
            return withScheme ? `file://${fullPath}` : fullPath;
        };

        // Shim fetch to intercept dummy http://localhost requests and serve them via fs
        const originalFetch = window.fetch;
        window.fetch = async function(url, options) {
            const urlStr = typeof url === 'string' ? url : (url.url || '');
            if (urlStr.includes('http://localhost/')) {
                const fileName = urlStr.split('/').pop();
                console.log('Intercepting fetch for local file:', fileName);
                try {
                    const fs = window.__require('fs');
                    const filePath = window.getAbsolutePath(fileName, false);
                    
                    // Support both Buffer and relative path if fs supports it
                    const buffer = fs.readFileSync(filePath);
                    
                    const isJson = fileName.endsWith('.json');
                    const contentType = isJson ? 'application/json' : 'application/octet-stream';
                    
                    // Create a response from the buffer
                    return new Response(buffer, {
                        status: 200,
                        headers: { 'Content-Type': contentType }
                    });
                } catch (e) {
                    console.error('Fetch shim failed for', fileName, e);
                    return new Response(null, { status: 404, statusText: 'Not Found' });
                }
            }
            return originalFetch(url, options);
        };
    </script>

    <script>
        let micStream = null;

        async function updateMicList() {
            try {
                // Pre-check permission to get labels
                if (window.checkPermission) {
                    await window.checkPermission('microphone');
                }

                const devices = await navigator.mediaDevices.enumerateDevices();
                const mics = devices.filter(d => d.kind === 'audioinput');
                const select = document.getElementById('mic-select');
                const wrapper = document.getElementById('mic-select-wrapper');

                if (mics.length > 0) {
                    const currentSelection = select.value;
                    select.innerHTML = '';

                    mics.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.deviceId;
                        opt.text = m.label || `Microphone ${select.length + 1}`;
                        if (m.deviceId === currentSelection) opt.selected = true;
                        select.appendChild(opt);
                    });

                    wrapper.style.display = 'flex';
                    availableMics = mics;
                }
            } catch (e) {
                console.error("Failed to list microphones", e);
            }
        }

        function handleMicChange() {
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
        }

        async function getMicStream() {
            if (micStream && micStream.active) return micStream;

            if (window.checkPermission) {
                await window.checkPermission('microphone');
            }

            const micId = document.getElementById('mic-select').value;
            const constraints = { audio: true };
            if (micId) {
                constraints.audio = { deviceId: { exact: micId } };
            }

            try {
                micStream = await navigator.mediaDevices.getUserMedia(constraints);
                updateMicList(); // Update labels if they were blank
                return micStream;
            } catch (e) {
                console.error("Mic access denied", e);
                return null;
            }
        }

        let Lang = {};
        function loadLang() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                let lang = urlParams.get('lang');

                if (!lang) {
                    const rawPersist = localStorage.getItem('persist:storage');
                    if (rawPersist) {
                        try {
                            lang = JSON.parse(JSON.parse(rawPersist).persist).lang;
                        } catch (e) { }
                    }
                }
                lang = lang || 'ko';

                function deepMerge(target, source) {
                    for (const key in source) {
                        if (source[key] instanceof Object && key in target && !(source[key] instanceof Array)) {
                            deepMerge(target[key], source[key]);
                        } else {
                            target[key] = source[key];
                        }
                    }
                    return target;
                }

                const xhrEn = new XMLHttpRequest();
                xhrEn.open('GET', `../../renderer/resources/lang/en.json`, false);
                xhrEn.send();
                if (xhrEn.status === 200) {
                    Lang = JSON.parse(xhrEn.responseText);
                }

                if (lang !== 'en') {
                    const xhrLang = new XMLHttpRequest();
                    xhrLang.open('GET', `../../renderer/resources/lang/${lang}.json`, false);
                    xhrLang.send();
                    if (xhrLang.status === 200) {
                        const localized = JSON.parse(xhrLang.responseText);
                        deepMerge(Lang, localized);
                    }
                }
            } catch (e) {
                console.error("Failed to load language file", e);
            }
        }

        function getMsg(key) {
            if (!key) return '';
            const keys = key.split('.');
            let obj = Lang;
            for (const k of keys) {
                if (!obj || obj[k] === undefined) return key;
                obj = obj[k];
            }
            return obj;
        }

            }
            document.getElementById('result-title').innerText = getMsg('AiLearning.result') || '결과';
            const resultDescElement = document.getElementById('result-desc');
            if (resultDescElement) {

            }

            const resultModeSelect = document.getElementById('result-mode-select');

                resultModeSelect.options[0].text = getMsg('AiLearning.mode_record') || '녹음';
                resultModeSelect.options[1].text = getMsg('AiLearning.mode_upload') || '업로드';

                resultUploadTitle.innerText = getMsg('AiLearning.upload_box_text') || '파일 업로드';
            }

            if (classes.length > 0) renderClasses();
        }

        let classes = [];
        let isTraining = false;
        let currentModalClassId = null;

        let recognizer;
        let transferRecognizer;

        async function initEngine() {
            console.log("Initializing Speech Engine with Absolute Paths...");
            try {
                // Use dummy http://localhost URLs to force BROWSER mode (fetch)
                // file:// URLs trigger Node-only logic in speech-commands.min.js
                const modelUrl = 'http://localhost/model.json';
                const metadataUrl = 'http://localhost/metadata.json';
                
                recognizer = speechCommands.create(
                    'BROWSER_FFT',
                    null,
                    modelUrl,
                    metadataUrl
                );
                console.log("Created recognizer, loading via Absolute Path shim...");
                await recognizer.ensureModelLoaded();
                transferRecognizer = recognizer.createTransfer('custom');
                console.log("Speech Engine Loaded Successfully");
            } catch(e) {
                console.error("Failed to load TFJS Speech Engine", e);
                alert("엔진 로드 실패: " + e.message);
            }
        }

        function initApp() {
            if (classes.length === 0) {
                addClass();
                addClass();
            }
        }



        function addClass() {
            const id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
            const classObj = {
                id: id,
                name: `${getMsg('AiLearning.class_placeholder')} ${classes.length + 1}`,
                samples: 0,
                mode: 'record',
                sampleData: []
            };
            classes.push(classObj);
            renderClasses();
            updateTrainStatus();
        }

        function removeClass(id) {
            if (classes.length <= 2) return;
            classes = classes.filter(c => c.id !== id);
            renderClasses();
            updateTrainStatus();
        }

        function updateClassName(id, name) {
            const cls = classes.find(c => c.id === id);
            if (cls) cls.name = name;
        }

        function updateClassMode(id, mode) {
            const cls = classes.find(c => c.id === id);
            if (cls) {
                cls.mode = mode;
                renderClasses();
            }
        }

        function playClassAudio(id) {
            const cls = classes.find(c => c.id === id);
            if (!cls) return;

            if (cls.sourceNode) {
                try { cls.sourceNode.stop(); } catch(e) {}
                cls.sourceNode = null;
            }

            if (!cls.audioBuffer) {
                if (cls.audioUrl) {
                    const audio = new Audio(cls.audioUrl);
                    audio.play();
                }
                return;
            }
            
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createBufferSource();
            source.buffer = cls.audioBuffer;
            source.connect(audioCtx.destination);
            cls.sourceNode = source;
            
            const duration = cls.audioBuffer.duration;
            const leftR = cls.leftRatio || 0;
            const rightR = (cls.rightRatio !== undefined) ? cls.rightRatio : 1;
            
            const startTime = leftR * duration;
            const playDuration = (rightR - leftR) * duration;
            
            source.start(0, startTime, playDuration);
        }

        async function handleClassAction(id) {
            const cls = classes.find(c => c.id === id);
            if (!cls) return;

            if (cls.mode === 'record') {
                if (!cls.hasPendingAudio) {
                     cls.leftRatio = 0.0;
                     cls.rightRatio = 1.0;
                    await startRecordingInsideCard(cls);
                } else {
                    // Reset pending state to re-record
                    cls.hasPendingAudio = false;
                    cls.leftRatio = 0.0;
                    cls.rightRatio = 1.0;
                    if (cls.pendingTensor) cls.pendingTensor.dispose();
                    cls.pendingTensor = null;
                    if (cls.pendingUid && transferRecognizer) {
                        try { transferRecognizer.removeExample(cls.pendingUid); } catch(e) {}
                    }
                    cls.pendingUid = null;
                    if (cls.audioUrl) {
                        URL.revokeObjectURL(cls.audioUrl);
                        cls.audioUrl = null;
                    }
                    cls.audioBuffer = null;
                    if (cls.sourceNode) {
                        try { cls.sourceNode.stop(); } catch(e) {}
                        cls.sourceNode = null;
                    }
                    await startRecordingInsideCard(cls);
                }
            } else {
                handleFileUploadInsideCard(cls);
            }
        }

        async function startRecordingInsideCard(cls) {
            const stream = await getMicStream();
            if (!stream) {
                alert('마이크 접근 권한이 필요합니다.');
                return;
            }

            const length = parseInt(document.getElementById('record-time-input').value) || 3;
            cls.isRecording = true;
            renderClasses();
            const canvas = document.getElementById(`canvas-${cls.id}`);

            // Live visualization logic
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(stream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const ctx = canvas.getContext('2d');

            cls.liveWaveform = new Array(100).fill(0);
            const startTime = performance.now();
            let animationId;
            function draw() {
                if (!cls.isRecording) {
                    cancelAnimationFrame(animationId);
                    return;
                }
                animationId = requestAnimationFrame(draw);
                analyser.getByteTimeDomainData(dataArray);

                let sum = 0;
                for(let i=0; i<dataArray.length; i++) sum += Math.abs(dataArray[i] - 128);
                
                // Map the 0-128 integer deviation to a 0-1 float deviation
                let equivalentFloat = (sum / dataArray.length) / 128.0;
                
                // Use the precise scaler as the static waveform decoder (* 255 * 5)
                let amplitudeVal = equivalentFloat * 255 * 5;

                const elapsed = (performance.now() - startTime) / 1000;
                let currentBucket = Math.floor((elapsed / length) * 100);
                if (currentBucket >= 100) currentBucket = 99;
                
                if (currentBucket >= 0) {
                     cls.liveWaveform[currentBucket] = Math.max(cls.liveWaveform[currentBucket], Math.min(255, amplitudeVal));
                     for (let i = currentBucket - 1; i >= 0 && cls.liveWaveform[i] === 0; i--) {
                         cls.liveWaveform[i] = cls.liveWaveform[currentBucket];
                     }
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffb800';
                
                const numPoints = 100;
                const step = canvas.width / numPoints;
                const barWidth = Math.max(1, step * 0.8);
                let x = 0;
                for (let i = 0; i < numPoints; i++) {
                    const barHeight = Math.min((cls.liveWaveform[i] / 255) * canvas.height * 1.5, canvas.height * 0.9);
                    ctx.fillRect(x, (canvas.height - barHeight) / 2, barWidth, Math.max(2, barHeight));
                    x += step;
                }
            }
            draw();

            let chunks = [];
            let mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            let recordingPromise = new Promise(resolve => {
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    cls.audioUrl = URL.createObjectURL(blob);
                    
                    try {
                        const arrayBuffer = await blob.arrayBuffer();
                        const audioCtxRaw = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                        const audioBuffer = await audioCtxRaw.decodeAudioData(arrayBuffer);
                        cls.audioBuffer = audioBuffer;
                        const channelData = audioBuffer.getChannelData(0);
                        const stepSize = Math.floor(channelData.length / 100);
                        cls.staticWaveform = [];
                        for(let i=0; i<100; i++) {
                            let sum = 0;
                            for(let j=0; j<stepSize; j++) {
                                sum += Math.abs(channelData[i*stepSize + j]);
                            }
                            cls.staticWaveform.push((sum / stepSize) * 255 * 5);
                        }
                    } catch(e) {
                        console.error('Failed to decode waveform from recording', e);
                    }
                    resolve();
                };
            });
            mediaRecorder.start();

            let initialSamplesCount = 0;
            if (transferRecognizer) {
                try {
                    initialSamplesCount = transferRecognizer.getExamples(cls.id).length;
                } catch(e) { }
            }

            try {
                if (transferRecognizer) {
                    transferRecognizer.collectExample(cls.id, { durationSec: length }).catch(e => console.error("collectExample bg error:", e));
                }
                if (length > 0) {
                    await new Promise(r => setTimeout(r, length * 1000));
                }
            } catch(e) {
                console.error("Failed to wait for recording", e);
            }

            // Cleanup local stream for waveform
            cls.isRecording = false;
            mediaRecorder.stop();
            await recordingPromise; // Wait for the blob to be processed and staticWaveform overwritten

            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (audioCtx) {
                audioCtx.close();
            }

            if (transferRecognizer) {
                // Poll for up to 1.5 seconds to wait for collectExample to finish depositing
                let retries = 15;
                while (retries-- > 0) {
                    try {
                        if (transferRecognizer.getExamples(cls.id).length > initialSamplesCount) break;
                    } catch(e) { }
                    await new Promise(r => setTimeout(r, 100));
                }

                const tf = window.tf;
                try {
                    const examples = transferRecognizer.getExamples(cls.id);
                    if (examples && examples.length > initialSamplesCount) {
                        const latest = examples[examples.length - 1]; // Use newly added example
                        cls.pendingUid = latest.uid;
                        
                        const spec = latest.example.spectrogram;
                        cls.pendingTensor = tf.tensor4d(spec.data, [1, spec.data.length / spec.frameSize, spec.frameSize, 1]);
                        
                        cls.hasPendingAudio = true;
                        cls.leftRatio = 0.0;
                        cls.rightRatio = 1.0;
                    }
                } catch(e) {
                    console.error("Failed to extract collected example", e);
                }
            } else {
                cls.hasPendingAudio = true;
                cls.leftRatio = 0.0;
                cls.rightRatio = 1.0;
            }

            renderClasses();
            updateTrainStatus();
        }

        async function submitPendingAudio(id) {
            const cls = classes.find(c => c.id === id);
            if (!cls || !cls.hasPendingAudio) return;

            const tf = window.tf;
            if (transferRecognizer && cls.pendingTensor) {
                const data = cls.pendingTensor.dataSync();
                const shape = cls.pendingTensor.shape; 
                const numFrames = shape[1];
                const frameSize = shape[2];
                
                const startFrame = Math.floor(cls.leftRatio * numFrames);
                const endFrame = Math.ceil(cls.rightRatio * numFrames);
                
                let minVal = 0;
                for(let i=0; i<data.length; i++) if(data[i] < minVal) minVal = data[i];
                
                const croppedData = new Float32Array(data.length);
                for(let f=0; f<numFrames; f++) {
                    const isSelected = (f >= startFrame && f <= endFrame);
                    for(let i=0; i<frameSize; i++) {
                        croppedData[f*frameSize + i] = isSelected ? data[f*frameSize + i] : minVal;
                    }
                }
                
                if (cls.pendingUid) {
                    try { transferRecognizer.removeExample(cls.pendingUid); } catch(e) {}
                    cls.pendingUid = null;
                }
                
                if (transferRecognizer.dataset) {
                    transferRecognizer.dataset.addExample({
                        label: cls.id,
                        spectrogram: {
                            data: croppedData,
                            frameSize: frameSize
                        }
                    });
                }
            }

            cls.hasPendingAudio = false;
            if (cls.pendingTensor) {
                cls.pendingTensor.dispose();
                cls.pendingTensor = null;
            }
            cls.samples++;

            // Create a small summary waveform for the thumbnail
            const thumbWaveform = [];
            const skip = Math.max(1, Math.floor(cls.staticWaveform.length / 10));
            for(let i=0; i<10; i++) {
                thumbWaveform.push((cls.staticWaveform[i * skip] || 10) / 4 + 5);
            }

            cls.sampleData.push({ 
                id: Date.now(),
                waveform: thumbWaveform,
                audioBuffer: cls.audioBuffer,
                leftRatio: cls.leftRatio,
                rightRatio: cls.rightRatio
            });

            renderClasses();
            updateTrainStatus();
        }

        function drawStaticWaveform(id) {
            const cls = classes.find(c => c.id === id);
            if (!cls || !cls.staticWaveform || cls.staticWaveform.length === 0) return;
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            canvas.width = canvas.offsetWidth || 300;
            canvas.height = canvas.offsetHeight || 100;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffb800';
            
            const numPoints = cls.staticWaveform.length;
            const step = canvas.width / numPoints;
            const barWidth = Math.max(1, step * 0.8);
            let x = 0;
            for (let i = 0; i < numPoints; i++) {
                // Amplify slightly and ensure it fits mostly in the canvas vertically
                const barHeight = Math.min((cls.staticWaveform[i] / 255) * canvas.height * 1.5, canvas.height * 0.9);
                ctx.fillRect(x, (canvas.height - barHeight) / 2, barWidth, Math.max(2, barHeight));
                x += step;
            }
        }

        // --- Drag Logic ---
        let currentDrag = null;
        function startCropDrag(e, classId, handle) {
            e.preventDefault();
            e.stopPropagation();
            currentDrag = { id: classId, handle: handle };
        }
        window.addEventListener('mouseup', () => { currentDrag = null; });
        window.addEventListener('mousemove', (e) => {
            if (!currentDrag) return;
            const cls = classes.find(c => c.id === currentDrag.id);
            if (!cls) return;
            const box = document.getElementById(`visualizer-box-${cls.id}`);
            if (!box) return;
            const rect = box.getBoundingClientRect();
            let ratio = (e.clientX - rect.left) / rect.width;
            ratio = Math.max(0, Math.min(1, ratio));

            if (currentDrag.handle === 'left') {
                if (ratio >= cls.rightRatio - 0.05) ratio = cls.rightRatio - 0.05;
                cls.leftRatio = ratio;
                document.getElementById(`crop-left-handle-${cls.id}`).style.left = `${ratio * 100}%`;
                document.getElementById(`crop-left-overlay-${cls.id}`).style.width = `${ratio * 100}%`;
            } else {
                if (ratio <= cls.leftRatio + 0.05) ratio = cls.leftRatio + 0.05;
                cls.rightRatio = ratio;
                document.getElementById(`crop-right-handle-${cls.id}`).style.right = `${(1 - ratio) * 100}%`;
                document.getElementById(`crop-right-overlay-${cls.id}`).style.width = `${(1 - ratio) * 100}%`;
            }
        });

        async function handleFileUploadInsideCard(cls) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'audio/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                cls.audioUrl = URL.createObjectURL(file);

                cls.isRecording = true;
                renderClasses();
                
                const btn = document.querySelector(`.mic-btn[onclick="handleClassAction('${cls.id}')"]`);
                if (btn) btn.classList.add('recording');
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    cls.audioBuffer = audioBuffer;
                    
                    const source = audioCtx.createBufferSource();
                    source.buffer = audioBuffer;
                    
                    const dest = audioCtx.createMediaStreamDestination();
                    source.connect(dest);
                    
                    const originalGetUserMedia = navigator.mediaDevices.getUserMedia;
                    navigator.mediaDevices.getUserMedia = async () => dest.stream;
                    
                    const durationSec = Math.min(10, audioBuffer.duration);
                    
                    let initialSamplesCount = 0;
                    if (transferRecognizer) {
                        try {
                            initialSamplesCount = transferRecognizer.getExamples(cls.id).length;
                        } catch(err) {}
                    }
                    
                    const channelData = audioBuffer.getChannelData(0);
                    const stepSize = Math.floor(channelData.length / 100);
                    cls.staticWaveform = [];
                    for(let i=0; i<100; i++) {
                        let sum = 0;
                        for(let j=0; j<stepSize; j++) {
                            sum += Math.abs(channelData[i*stepSize + j]);
                        }
                        cls.staticWaveform.push((sum / stepSize) * 255 * 5);
                    }
                    const canvas = document.getElementById(`canvas-${cls.id}`);
                    if (canvas) {
                        canvas.style.display = 'block';
                        drawStaticWaveform(cls.id);
                    }
                    
                    if (transferRecognizer) {
                        transferRecognizer.collectExample(cls.id, { durationSec: durationSec }).catch(err => console.error("collectExample bg error:", err));
                    }
                    
                    source.start(0);
                    await new Promise(r => setTimeout(r, durationSec * 1000));
                    source.stop();
                    
                    navigator.mediaDevices.getUserMedia = originalGetUserMedia;
                    audioCtx.close();
                    
                    if (transferRecognizer) {
                        let retries = 15;
                        while (retries-- > 0) {
                            try {
                                if (transferRecognizer.getExamples(cls.id).length > initialSamplesCount) break;
                            } catch(err) { }
                            await new Promise(r => setTimeout(r, 100));
                        }
                        
                        const tf = window.tf;
                        try {
                            const examples = transferRecognizer.getExamples(cls.id);
                            if (examples && examples.length > initialSamplesCount) {
                                const latest = examples[examples.length - 1];
                                cls.pendingUid = latest.uid;
                                const spec = latest.example.spectrogram;
                                cls.pendingTensor = tf.tensor4d(spec.data, [1, spec.data.length / spec.frameSize, spec.frameSize, 1]);
                                
                                cls.hasPendingAudio = true;
                                cls.leftRatio = 0.0;
                                cls.rightRatio = 1.0;
                            }
                        } catch(err) { }
                    } else {
                        cls.hasPendingAudio = true;
                        cls.leftRatio = 0.0;
                        cls.rightRatio = 1.0;
                    }

                } catch(error) {
                    console.error("File upload and processing failed", error);
                    alert("오디오 데이터 변환에 실패했습니다.");
                }
                
                cls.isRecording = false;
                renderClasses();
                updateTrainStatus();
            };
            input.click();
        }

            const cls = classes.find(c => c.id === classId);
            if (cls) {

        function playSampleAudio(classId, sampleId) {
            const cls = classes.find(c => c.id === classId);
            if (!cls) return;
            const sample = cls.sampleData.find(s => s.id === sampleId);
            if (!sample || !sample.audioBuffer) return;

            if (sample.sourceNode) {
                try { sample.sourceNode.stop(); } catch(e) {}
                sample.sourceNode = null;
            }

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createBufferSource();
            source.buffer = sample.audioBuffer;
            source.connect(audioCtx.destination);
            sample.sourceNode = source;
            
            const duration = sample.audioBuffer.duration;
            const leftR = sample.leftRatio || 0;
            const rightR = (sample.rightRatio !== undefined) ? sample.rightRatio : 1;
            
            const startTime = leftR * duration;
            const playDuration = (rightR - leftR) * duration;
            
            source.start(0, startTime, playDuration);
        }

                const height = data ? data[i] : Math.random() * 20 + 5;

        function updateTrainStatus() {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');
            const perc = document.getElementById('train-status-perc');
            const progressContainer = document.getElementById('train-progress-container');

            const allHaveEnough = classes.every(c => c.samples >= 5);

            if (allHaveEnough) {
                btn.classList.add('ready');
                btn.disabled = false;
                status.innerText = getMsg('AiLearning.train_status_ready') || 'Ready';
                perc.style.display = 'none';
                progressContainer.style.display = 'none';
            } else {
                btn.classList.remove('ready');
                btn.disabled = true;
                status.innerText = getMsg('AiLearning.data_input_first');
                perc.style.display = 'none';
                progressContainer.style.display = 'none';
            }
        }

        document.getElementById('train-btn').onclick = async () => {
            if (classes.some(c => c.samples < 1 && c.id !== '_background_noise_')) {
                alert(getMsg('AiLearning.data_input_first'));
                return;
            }
            const btn = document.getElementById('train-btn');
            btn.disabled = true;
            btn.classList.remove('ready');
            const applyBtn = document.getElementById('apply-btn');
            applyBtn.disabled = true;
            applyBtn.classList.remove('ready');

            const status = document.getElementById('train-status');
            const perc = document.getElementById('train-status-perc');
            const progressContainer = document.getElementById('train-progress-container');
            const progress = document.getElementById('train-progress-fill');

            if (transferRecognizer) {
                status.innerText = getMsg('AiLearning.collecting_background_noise') || "배경 소음 수집 중...";
                try {
                    // Collect more background noise for better robustness
                    for (let i = 0; i < 5; i++) {
                        await transferRecognizer.collectExample('_background_noise_');
                        progress.style.width = `${(i + 1) * 10}%`;
                    }
                } catch(e) {
                    console.error("Noise collection failed", e);
                }
            }

            status.innerText = getMsg('AiLearning.training_in_progress');
            perc.innerText = '0%';
            perc.style.display = 'block';
            progressContainer.style.display = 'block';
            progress.style.width = '0%';

            if (transferRecognizer) {
                try {
                    const onEpochEnd = async (epoch, logs) => {
                        const prog = Math.round(((epoch + 1) / 20) * 100);
                        perc.innerText = `${prog}%`;
                        progress.style.width = `${prog}%`;
                        await new Promise(r => setTimeout(r, 50)); // Slow down fast training
                    };
                    await transferRecognizer.train({
                        epochs: 20,
                        callback: { onEpochEnd },
                        callbacks: { onEpochEnd }
                    });
                } catch(e) {
                    console.error("Training failed", e);
                }
            } else {
                for (let i = 1; i <= 10; i++) {
                    await new Promise(r => setTimeout(r, 150));
                    perc.innerText = `${i * 10}%`;
                    progress.style.width = `${i * 10}%`;
                }
            }

            isTraining = true;
            status.innerText = getMsg('AiLearning.training_complete');
            perc.style.display = 'none';
            progressContainer.style.display = 'none';
            btn.classList.add('ready');
            btn.disabled = false;
            document.getElementById('apply-btn').disabled = false;

            showResult();
        };

        async function handleResultFileUpload(input) {
            const file = input.files[0];
            if (!file || !transferRecognizer) return;

            const resultText = document.getElementById('result-primary-text');
            resultText.innerText = getMsg('AiLearning.predict') + '...';
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                // For simplest implementation, we use the same shim strategy or process the buffer
                // The speech-commands library expect a 1 sec (44100 samples) Float32Array
                // but recognizer.recognize(spectrogram) is also possible.
                
                // Let's use the recognition task
                // We'll take the first 1 second of the audio for now
                const offlineCtx = new OfflineAudioContext(1, 44100, 44100);
                const source = offlineCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(offlineCtx.destination);
                source.start();
                const renderedBuffer = await offlineCtx.startRendering();
                const floatData = renderedBuffer.getChannelData(0);

                if (transferRecognizer) {
                    const result = await transferRecognizer.recognize(floatData);
                    const wordLabels = transferRecognizer.wordLabels();
                    const scores = result.scores;
                    
                    const probabilities = classes.map(c => {
                        const labelIndex = wordLabels.indexOf(c.id);
                        return {
                            className: c.name,
                            probability: labelIndex !== -1 ? scores[labelIndex] : 0
                        };
                    });

                    probabilities.sort((a, b) => b.probability - a.probability);
                    renderPredictions(probabilities);
                    
                    const winner = probabilities[0];
                    if (winner && winner.probability > 0.5) {
                        resultText.innerText = winner.className;
                        resultText.style.color = '#5a87ff';
                    } else {
                        resultText.innerText = getMsg('AiLearning.unknown') || '인식 결과 없음';
                    }
                }
            } catch (e) {
                console.error("Result file processing failed", e);
                resultText.innerText = getMsg('AiLearning.model_status_3') || '분석 실패';
            }
        }

        let resultAudioCtx = null;
        let resultAnalyser = null;
        let resultDataArray = null;
        let resultAnimId = null;

        let isResultPredicting = false;
        async function toggleRealtimePrediction(active) {
            console.log("toggleRealtimePrediction:", active);
            if (!isTraining || !transferRecognizer) {
                console.warn("Prediction blocked: isTraining=", isTraining, "transferRecognizer=", !!transferRecognizer);
                return;
            }
            const canvas = document.getElementById('result-canvas');
            const resultText = document.getElementById('result-primary-text');

            if (active) {
                if (isResultPredicting) return;
                isResultPredicting = true;
                
                try {
                    // Reset visualizer canvas
                    canvas.width = canvas.clientWidth;
                    canvas.height = canvas.clientHeight;
                    const ctx = canvas.getContext('2d');
                    
                    // 1. Setup Visualizer (Microphone concurrent access)
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    resultAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = resultAudioCtx.createMediaStreamSource(stream);
                    resultAnalyser = resultAudioCtx.createAnalyser();
                    resultAnalyser.fftSize = 256;
                    source.connect(resultAnalyser);
                    resultDataArray = new Uint8Array(resultAnalyser.frequencyBinCount);
                    
                    let resultWaveform = new Array(100).fill(0);
                    const draw = () => {
                        if (!resultAudioCtx) return;
                        resultAnimId = requestAnimationFrame(draw);
                        
                        resultAnalyser.getByteTimeDomainData(resultDataArray);
                        let sum = 0;
                        for(let i=0; i<resultDataArray.length;i++) sum += Math.abs(resultDataArray[i] - 128);
                        let equivalentFloat = (sum / resultDataArray.length) / 128.0;
                        let amplitudeVal = equivalentFloat * 255 * 5;
                        
                        resultWaveform.unshift(Math.min(255, amplitudeVal));
                        resultWaveform.pop();
                        
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#ffb800';
                        
                        const numPoints = 100;
                        const step = canvas.width / numPoints;
                        const barWidth = Math.max(1, step * 0.8);
                        
                        let x = 0;
                        for (let i = 0; i < numPoints; i++) {
                            const barHeight = Math.min((resultWaveform[i] / 255) * canvas.height * 1.5, canvas.height * 0.9);
                            ctx.fillRect(x, (canvas.height - barHeight) / 2, barWidth, Math.max(2, barHeight));
                            x += step;
                        }
                    };
                    draw();

                    // 2. Setup background speech recognition
                    await transferRecognizer.listen(result => {
                        const wordLabels = transferRecognizer.wordLabels();
                        const scores = result.scores;
                        
                        const probabilities = classes.map(c => {
                            const labelIndex = wordLabels.indexOf(c.id);
                            return {
                                className: c.name,
                                probability: labelIndex !== -1 ? scores[labelIndex] : 0
                            };
                        });


                        // probabilities.sort((a, b) => b.probability - a.probability);
                        renderPredictions(probabilities);
                        
                        const winner = probabilities[0];
                        if (winner && winner.probability > 0.5) {
                            resultText.innerText = winner.className;
                            resultText.style.color = '#5a87ff';
                        } else {
                            resultText.innerText = '';
                        }
                    }, {
                        invokeCallbackOnNoiseAndUnknown: true,
                        probabilityThreshold: 0,
                        overlapFactor: 0.75
                    });
                } catch(e) {
                    console.error("Listening failed", e);
                    isResultPredicting = false;
                    alert("인식 시작 실패: 마이크 권한을 확인해주세요.");
                }
            } else {
                isResultPredicting = false;
                if (transferRecognizer && transferRecognizer.isListening()) {
                    transferRecognizer.stopListening().catch(()=>{});
                }
                if (resultAudioCtx) {
                    resultAudioCtx.close().catch(()=>{});
                    resultAudioCtx = null;
                    cancelAnimationFrame(resultAnimId);
                }
                resultText.innerText = '';
                renderPredictions(classes.map(c => ({ className: c.name, probability: 0 })));
                const ctx = canvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function showResult() {
            document.getElementById('result-placeholder-ui').style.display = 'none';
            document.getElementById('result-active-ui').style.display = 'block';
            document.getElementById('result-prediction-area').style.display = 'block';
            document.getElementById('prediction-list').innerHTML = '';
            renderPredictions(classes.map(c => ({ className: c.name, probability: 0 })));
        }

        function renderPredictions(probabilities) {
            const list = document.getElementById('prediction-list');
            list.innerHTML = '';
            document.getElementById('result-prediction-area').style.display = 'block';

            probabilities.forEach((prob) => {
                const item = document.createElement('div');
                item.className = 'prediction-item';
                item.style.marginBottom = '12px';
                
                const percent = Math.round(prob.probability * 100);
                const isWinner = percent > 50;
                const barBackground = isWinner 
                    ? 'linear-gradient(90deg, #5a87ff 0%, #7aa1ff 100%)' 
                    : '#dee2e6';
                const textColor = (isWinner && percent > 30) ? '#fff' : '#666';
                
                item.innerHTML = `
                    <div class="prediction-name" style="margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #495057; display: flex; justify-content: space-between;">
                        <span>${prob.className}</span>
                        <span style="color: ${isWinner ? '#5a87ff' : '#adb5bd'};">${percent}%</span>
                    </div>
                    <div class="prediction-bar-bg" style="height: 12px; border-radius: 6px; background: #f1f3f5; position: relative; overflow: hidden;">
                        <div class="prediction-bar-fill" style="position: absolute; left: 0; top: 0; height: 100%; width: ${percent}%; background: ${barBackground}; transition: width 0.2s ease-out; border-radius: 6px;"></div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        document.getElementById('add-class-btn').onclick = addClass;

        const recordTimeInput = document.getElementById('record-time-input');
        recordTimeInput.addEventListener('change', () => {
            let val = Math.round(parseFloat(recordTimeInput.value));
            if (isNaN(val) || val < 1) val = 1;
            else if (val > 3) val = 3;
            recordTimeInput.value = String(val);
        });

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        document.getElementById('apply-btn').onclick = async () => {
            const btn = document.getElementById('apply-btn');
            btn.disabled = true;
            btn.innerText = '저장 중...';

            const projectName = document.getElementById('model-name').value || getMsg('AiLearning.model_name_placeholder');
            const recordTime = parseInt(document.getElementById('record-time-input').value) || 3;

            let modelArtifacts = null;
            if (transferRecognizer) {
                try {
                    await transferRecognizer.model.save({
                        save: async (artifacts) => {
                            modelArtifacts = {
                                modelTopology: artifacts.modelTopology,
                                weightSpecs: artifacts.weightSpecs,
                                weightDataBase64: arrayBufferToBase64(artifacts.weightData)
                            };
                            return { modelArtifactsInfo: { dateSaved: new Date(), modelTopologyType: 'JSON' } };
                        }
                    });
                } catch(e) {
                    console.error("Failed to save Speech model artifacts", e);
                }
            }

            const modelData = {
                type: 'speech',
                name: projectName,
                recordTime: recordTime,
                classes: classes.map(c => ({ name: c.name, count: c.samples })),
                modelArtifacts: modelArtifacts,
                labels: classes.map(c => c.name)
            };

            if (window.ipcSend) { window.ipcSend('trainComplete', modelData); window.close(); } else if (window.opener) {
                window.opener.postMessage({
                    type: 'trainComplete',
                    modelData: modelData
                }, '*');
                window.close();
            }
        };

        // Initialize immediately
        loadLang();
        applyI18n();
        initApp();

        window.addEventListener('load', async () => {
            await initEngine();
            updateMicList();
        });
    </script>
</body>

</html>

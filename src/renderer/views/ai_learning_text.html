    <!-- Modal mapping and old NaiveBayes removed, integrated inline and TFJS -->
    <script>
        class NaiveBayes {
            constructor() {
                this.options = {};
                this.vocabulary = {};
                this.vocabularySize = 0;
                this.totalDocuments = 0;
                this.docCount = {};
                this.wordCount = {};
                this.wordFrequencyCount = {};
                this.categories = {};
            }

            tokenize(text) {
                return text.split(/\s+/).filter(w => w.length > 0);
            }

            frequencyTable(tokens) {
                return tokens.reduce((acc, cur) => {
                    acc[cur] = (acc[cur] || 0) + 1;
                    return acc;
                }, {});
            }

            initializeCategory(categoryName) {
                if (!this.categories[categoryName]) {
                    this.docCount[categoryName] = 0;
                    this.wordCount[categoryName] = 0;
                    this.wordFrequencyCount[categoryName] = {};
                    this.categories[categoryName] = true;
                }
            }

            learn(text, category) {
                this.initializeCategory(category);
                this.docCount[category]++;
                this.totalDocuments++;
                
                // entry-js expects tokenizer to be run; the workspace uses Khaiii,
                // but we simulate it here with a simple whitespace tokenizer for the fallback graph.
                const tokens = this.tokenize(text);
                const freqTable = this.frequencyTable(tokens);

                Object.keys(freqTable).forEach(token => {
                    if (!this.vocabulary[token]) {
                        this.vocabulary[token] = true;
                        this.vocabularySize++;
                    }
                    const freq = freqTable[token];
                    if (!this.wordFrequencyCount[category][token]) {
                        this.wordFrequencyCount[category][token] = freq;
                    } else {
                        this.wordFrequencyCount[category][token] += freq;
                    }
                    this.wordCount[category] += freq;
                });
            }

            toJson() {
                return {
                    categories: this.categories,
                    docCount: this.docCount,
                    totalDocuments: this.totalDocuments,
                    vocabulary: this.vocabulary,
                    vocabularySize: this.vocabularySize,
                    wordCount: this.wordCount,
                    wordFrequencyCount: this.wordFrequencyCount,
                    options: this.options
                };
            }
        }

        let naiveBayesModel = null;

        // Preprocessing for Uzbek (and general text)
        function cyrillicToLatin(text) {
            const map = {
                'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D', 'Е': 'E', 'Ё': 'Yo', 'Ж': 'J',
                'З': 'Z', 'И': 'I', 'Й': 'Y', 'К': 'K', 'Л': 'L', 'М': 'M', 'Н': 'N', 'О': 'O',
                'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T', 'У': 'U', 'Ф': 'F', 'Х': 'X', 'Ц': 'Ts',
                'Ч': 'Ch', 'Ш': 'Sh', 'Щ': 'Shq', 'Ъ': '\'', 'Ы': 'I', 'Ь': '', 'Э': 'E', 'Ю': 'Yu', 'Я': 'Ya',
                'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'yo', 'ж': 'j',
                'з': 'z', 'и': 'i', 'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o',
                'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u', 'ф': 'f', 'х': 'x', 'ц': 'ts',
                'ч': 'ch', 'ш': 'sh', 'щ': 'shq', 'ъ': '\'', 'ы': 'i', 'ь': '', 'э': 'e', 'ю': 'yu', 'я': 'ya',
                'Ғ': 'G\'', 'ғ': 'g\'', 'Қ': 'Q', 'қ': 'q', 'Ў': 'O\'', 'ў': 'o\'', 'Ҳ': 'H', 'ҳ': 'h'
            };
            return text.split('').map(c => map[c] || c).join('');
        }

        function removeUzbekSuffixes(word) {
            let w = word.toLowerCase();
            const suffixes = ['ning', 'ning', 'ni', 'ga', 'da', 'dan', 'lar', 'miz', 'siz', 'lar', 'im', 'ing', 'si', 'i'];
            let changed = true;
            while (changed) {
                changed = false;
                for (let s of suffixes) {
                    if (w.endsWith(s) && w.length > s.length + 2) { // Ensure root is at least 2 chars
                        w = w.slice(0, -s.length);
                        changed = true;
                        break; // Check again from top
                    }
                }
            }
            return w;
        }

        function preprocessText(text) {
            let latinText = cyrillicToLatin(text);
            const rgxPunctuation = /[^\w\s\']/g;
            let tokens = latinText.replace(rgxPunctuation, ' ').split(/\s+/).filter(t => t.length > 0);
            return tokens.map(removeUzbekSuffixes);
        }

        class Tokenizer {
            constructor() {
                this.wordIndex = { '<PAD>': 0, '<UNK>': 1 };
                this.indexWord = { 0: '<PAD>', 1: '<UNK>' };
                this.vocabSize = 2; // PAD, UNK
            }
            
            fitOnTexts(texts) {
                const count = {};
                for (let text of texts) {
                    const tokens = preprocessText(text);
                    for (let token of tokens) {
                        count[token] = (count[token] || 0) + 1;
                    }
                }
                const sorted = Object.keys(count).sort((a, b) => count[b] - count[a]);
                for (let word of sorted) {
                    this.wordIndex[word] = this.vocabSize;
                    this.indexWord[this.vocabSize] = word;
                    this.vocabSize++;
                }
            }

            textsToSequences(texts) {
                return texts.map(text => {
                    const tokens = preprocessText(text);
                    return tokens.map(token => this.wordIndex[token] !== undefined ? this.wordIndex[token] : 1);
                });
            }
        }

        function padSequences(sequences, maxLen) {
            return sequences.map(seq => {
                if (seq.length > maxLen) {
                    return seq.slice(seq.length - maxLen); // keep last maxLen words
                } else {
                    const pad = new Array(maxLen - seq.length).fill(0); // `<PAD>` is 0
                    return pad.concat(seq);
                }
            });
        }

        }

        function addClass() {
            const id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
            const classObj = {
                id: id,
                name: `${getMsg('AiLearningTree.class_placeholder')} ${classes.length + 1}`,
                samples: []
            };
            classes.push(classObj);
            renderClasses();
            updateTrainStatus();
        }

        function removeClass(id) {
            if (classes.length <= 2) return;
            classes = classes.filter(c => c.id !== id);
            renderClasses();
            updateTrainStatus();
        }

        function updateClassName(id, name) {
            const cls = classes.find(c => c.id === id);
            if (cls) cls.name = name;
        }

        let Lang = {};
        function loadLang() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                let lang = urlParams.get('lang');

                if (!lang) {
                    const rawPersist = localStorage.getItem('persist:storage');
                    if (rawPersist) {
                        try {
                            lang = JSON.parse(JSON.parse(rawPersist).persist).lang;
                        } catch (e) { }
                    }
                }
                lang = lang || 'ko';

                function deepMerge(target, source) {
                    for (const key in source) {
                        if (source[key] instanceof Object && key in target && !(source[key] instanceof Array)) {
                            deepMerge(target[key], source[key]);
                        } else {
                            target[key] = source[key];
                        }
                    }
                    return target;
                }

                const xhrEn = new XMLHttpRequest();
                xhrEn.open('GET', `../../renderer/resources/lang/en.json`, false);
                xhrEn.send();
                if (xhrEn.status === 200 || xhrEn.status === 0) {
                    Lang = JSON.parse(xhrEn.responseText);
                }

                if (lang !== 'en') {
                    const xhrLang = new XMLHttpRequest();
                    xhrLang.open('GET', `../../renderer/resources/lang/${lang}.json`, false);
                    xhrLang.send();
                    if (xhrLang.status === 200 || xhrLang.status === 0) {
                        const localized = JSON.parse(xhrLang.responseText);
                        deepMerge(Lang, localized);
                    }
                }
            } catch (e) {
                console.error("Failed to load language file", e);
            }
        }

        function getMsg(key) {
            if (!key) return '';
            const keys = key.split('.');
            let obj = Lang;
            for (const k of keys) {
                if (!obj || obj[k] === undefined) return key;
                obj = obj[k];
            }
            return obj;
        }

        function applyI18n() {
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang');
            if (lang) document.documentElement.lang = lang;

            document.getElementById('nav-title').innerText = getMsg('AiLearningTree.text_title');
            document.getElementById('apply-btn').innerText = getMsg('AiLearningTree.apply');
            document.getElementById('view-tutorial').innerText = getMsg('AiLearningTree.tutorial');
            document.getElementById('model-name').placeholder = getMsg('AiLearning.model_name_placeholder');
            document.getElementById('input-title').innerText = getMsg('AiLearningTree.data_input');
            document.getElementById('input-desc').innerText = getMsg('AiLearningTree.data_input_desc');
            document.getElementById('train-title').innerText = getMsg('AiLearningTree.training');
            document.getElementById('train-desc').innerText = getMsg('AiLearningTree.training_desc');
            document.getElementById('result-title').innerText = getMsg('AiLearningTree.result');
            document.getElementById('result-desc').innerText = getMsg('AiLearningTree.result_desc');
            document.getElementById('add-class-text').innerText = getMsg('AiLearningTree.add_class');
            document.getElementById('train-btn').innerText = getMsg('AiLearningTree.train_model');
            document.getElementById('train-status').innerText = getMsg('AiLearning.data_input_first');
            document.getElementById('predict-placeholder').innerText = getMsg('AiLearningTree.train_first');

            // Re-render classes to apply translations to dynamically created elements
            if (classes.length > 0) renderClasses();
        }

        function updateClassData(id, text) {
            const cls = classes.find(c => c.id === id);
            if (cls) {
                const items = text.split(',').map(s => s.trim()).filter(s => s.length > 0);
                cls.samples = items;
                const countEl = document.getElementById(`count-${cls.id}`);
                if (countEl) countEl.innerText = `${items.length}개`;
                updateTrainStatus();
            }
        }

        function renderClasses() {
            const container = document.getElementById('classes-container');
            container.innerHTML = '';

            classes.forEach((cls) => {
                const card = document.createElement('div');
                card.className = 'class-card';
                card.innerHTML = `
                    <button class="delete-class-btn" onclick="removeClass('${cls.id}')" style="position:absolute; top:12px; right:12px;">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                    <div class="class-card-header" style="border-bottom:none; margin-bottom:0; padding-bottom:8px;">
                        <input type="text" class="class-name-input" 
                               value="${cls.name}" 
                               onchange="updateClassName('${cls.id}', this.value)">
                        <span class="sample-count" id="count-${cls.id}" style="margin-right:24px;">${cls.samples.length}개</span>
                    </div>
                    <div class="class-card-desc" style="padding: 0 4px 8px 4px;">모델이 학습할 텍스트 데이터를 작성해 주세요.<br>클래스 당 5개 이상의 데이터를 입력해야 합니다.<br>각각의 데이터는 쉼표로 구분합니다. (예: 맛있다, 맛있어, 맛있네)</div>
                    <textarea class="data-input-textarea" style="width: 100%; height: 90px; padding: 12px; border: 1px solid #dee2e6; border-radius: 4px; resize: vertical; box-sizing: border-box; font-family: inherit; font-size: 13px; outline: none; background: #fbfcfe; color: #495057;" placeholder="데이터를 쉼표(,)로 구분하여 입력하세요." oninput="updateClassData('${cls.id}', this.value)">${cls.samples.join(', ')}</textarea>
                `;
                container.appendChild(card);
            });
        }

        function updateTrainStatus() {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');

            const allHaveEnough = classes.every(c => c.samples.length >= 1);

            if (allHaveEnough) {
                btn.classList.add('ready');
                btn.disabled = false;
                status.innerText = getMsg('AiLearningTree.train_status_ready') || 'Ready';
            } else {
                btn.classList.remove('ready');
                btn.disabled = true;
                status.innerText = getMsg('AiLearning.data_input_first');
            }
        }

        document.getElementById('train-btn').onclick = async () => {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');
            const progressContainer = document.querySelector('.train-progress-bar');
            const progressFill = document.querySelector('.train-progress-fill') || document.createElement('div');
            
            if(!document.querySelector('.train-progress-fill')) {
                progressFill.className = 'train-progress-fill';
                progressContainer.appendChild(progressFill);
            }

            btn.classList.remove('ready');
            btn.disabled = true;
            status.innerText = getMsg('AiLearningTree.training_in_progress');
            progressContainer.style.display = 'block';

            // Collect data
            let allTexts = [];
            let allLabels = [];
            classNamesMap = classes.map(c => c.name);
            
            naiveBayesModel = new NaiveBayes();

            classes.forEach((cls, idx) => {
                cls.samples.forEach(sample => {
                    allTexts.push(sample);
                    allLabels.push(idx);
                    
                    // Train Naive Bayes fallback model for workspace execution
                    const processed = preprocessText(sample).join(' ');
                    naiveBayesModel.learn(processed, cls.name);
                });
            });

            tokenizer = new Tokenizer();
            tokenizer.fitOnTexts(allTexts);
            const sequences = tokenizer.textsToSequences(allTexts);
            
            maxLen = Math.max(...sequences.map(s => s.length), 5); // At least 5
            const padded = padSequences(sequences, maxLen);
            
            const xs = tf.tensor2d(padded, [padded.length, maxLen]);
            const ys = tf.tensor1d(allLabels, 'int32');
            const ysOneHot = tf.oneHot(ys, classes.length);

            model = tf.sequential();
            model.add(tf.layers.embedding({
                inputDim: tokenizer.vocabSize,
                outputDim: 32,
                inputLength: maxLen
            }));
            model.add(tf.layers.conv1d({
                filters: 64,
                kernelSize: 3,
                activation: 'relu',
                padding: 'same'
            }));
            model.add(tf.layers.globalMaxPooling1d({}));
            model.add(tf.layers.dense({ units: 32, activation: 'relu' }));
            model.add(tf.layers.dense({ units: classes.length, activation: 'softmax' }));

            model.compile({
                optimizer: 'adam',
                loss: 'categoricalCrossentropy',
                metrics: ['accuracy']
            });

            try {
                await model.fit(xs, ysOneHot, {
                    epochs: 30,
                    batchSize: Math.max(8, Math.floor(allTexts.length / 5)),
                    callbacks: {
                        onEpochEnd: (epoch, logs) => {
                            const progress = ((epoch + 1) / 30) * 100;
                            progressFill.style.width = `${progress}%`;
                        }
                    }
                });
            } catch(e) {
                console.error(e);
            }

            xs.dispose();
            ys.dispose();
            ysOneHot.dispose();

            isTraining = true;
            status.innerText = getMsg('AiLearningTree.training_complete');
            btn.classList.add('ready');
            btn.disabled = false;
            
            // hide progress after a bit
            setTimeout(() => { progressContainer.style.display = 'none'; }, 1000);

            showResult();
        };

        function showResult() {
            document.getElementById('result-placeholder-ui').style.display = 'none';
            document.getElementById('result-active-ui').style.display = 'block';
            document.getElementById('prediction-list').innerHTML = '';
            document.getElementById('result-predicted-class').innerText = '-';
            const guide = document.getElementById('result-guide-text');
            if (guide) guide.style.display = 'block';
            document.getElementById('result-prediction-area').style.display = 'none';
        }

        document.getElementById('test-btn').onclick = () => {
            if (!isTraining || !model) return;
            const text = document.getElementById('test-input').value;
            if (!text.trim()) return;

            runPrediction(text);
        };

        async function runPrediction(text) {
            const seq = tokenizer.textsToSequences([text]);
            const padded = padSequences(seq, maxLen);
            const inputTensor = tf.tensor2d(padded, [1, maxLen]);
            
            const predsTensor = model.predict(inputTensor);
            const preds = await predsTensor.data();
            
            const probabilities = Array.from(preds).map((prob, idx) => ({
                className: classNamesMap[idx],
                probability: prob
            })).sort((a, b) => b.probability - a.probability);

            const guide = document.getElementById('result-guide-text');
            if (guide) guide.style.display = 'none';
            document.getElementById('result-prediction-area').style.display = 'block';
            
            renderPredictions(probabilities);
        }

        function renderPredictions(probabilities) {
            const list = document.getElementById('prediction-list');
            list.innerHTML = '';

            const threshSlider = document.getElementById('confidence-threshold');
            const threshold = parseInt(threshSlider.value) / 100;
            
            const topPrediction = probabilities[0];
            const resultLabel = document.getElementById('result-predicted-class');
            
            if (topPrediction.probability >= threshold) {
                resultLabel.innerText = topPrediction.className;
            } else {
                resultLabel.innerText = '알 수 없음';
                resultLabel.style.color = '#adb5bd';
            }

            probabilities.forEach((prob) => {
                const item = document.createElement('div');
                item.className = 'prediction-item';
                item.innerHTML = `
                    <div class="prediction-name">${prob.className}</div>
                    <div class="prediction-bar-bg">
                        <div class="prediction-bar-fill" style="width: ${prob.probability * 100}%"></div>
                    </div>
                    <div class="prediction-perc">${(prob.probability * 100).toFixed(0)}%</div>
                `;
                list.appendChild(item);
            });
        }

        document.getElementById('add-class-btn').onclick = addClass;

        document.getElementById('apply-btn').onclick = () => {
            const projectName = document.getElementById('model-name').value || getMsg('AiLearning.model_name_placeholder');
            
            let modelDataObj = null;
            let resultData = [];
            if (isTraining && naiveBayesModel) {
                modelDataObj = naiveBayesModel.toJson();
                // Format matching entry-js getResult structure
                resultData = classes.map(c => ({ className: c.name, probability: 0 }));
            }

            const modelData = {
                type: 'text',
                name: projectName,
                classes: classes.map(c => ({ name: c.name, count: c.samples.length, samples: c.samples })),
                model: modelDataObj,
                result: resultData
            };

            if (window.ipcSend) { window.ipcSend('trainComplete', modelData); window.close(); } else if (window.opener) {
                window.opener.postMessage({
                    type: 'trainComplete',
                    modelData: modelData
                }, '*');
                window.close();
            }
        };

        window.addEventListener('load', setupUI);
    </script>
</body>

</html>
